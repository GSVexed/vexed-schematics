name: Booga Voodoo Lab v2 passive monitor regression
on:
  push:
    branches: [main]
    paths:
      - 'booga-reborn/booga-voodoo-lab-v2.lua'
      - 'booga-reborn/test-voodoo-monitors.py'
      - '.github/workflows/booga-voodoo-lab-v2-validate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Compile Luau source
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 2 --max-time 90 https://github.com/luau-lang/luau/releases/download/0.747/luau-ubuntu.zip -o /tmp/luau.zip
          mkdir -p /tmp/luau
          unzip -q /tmp/luau.zip -d /tmp/luau
          compiler="$(find /tmp/luau -name luau-compile -type f | head -n1)"
          test -n "$compiler"
          chmod +x "$compiler"
          "$compiler" --null booga-reborn/booga-voodoo-lab-v2.lua
      - name: Passive monitor contract and callback regression
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('booga-reborn/booga-voodoo-lab-v2.lua').read_text()
          for needle in ['booga_voodoo_lab_v2.json','owned_regen_items','client_cache','packet_listeners_installed=false','incoming_packets_observed=false','rejoin']:
              assert needle in s,needle
          assert '.listen(' not in s and '.send(' not in s
          assert 'd.voodoo=' not in s and 'util.Data.voodoo=' not in s
          print('PASSIVE_MONITOR_CONTRACT_PASS')
          PY
          chmod +x /tmp/luau/luau
          python3 booga-reborn/test-voodoo-monitors.py --luau /tmp/luau/luau
