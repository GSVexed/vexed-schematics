name: FERAL Territory Rush v4 - Compile and Guardrails
on:
  push:
    branches: [main]
    paths:
      - 'roblox-tools/feral-territory-rush-v4.0.lua'
      - 'roblox-tools/feral-nova-territory-rush.lua'
      - '.github/workflows/feral-territory-rush-v4-validate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  luau-and-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Static feature and safety assertions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source=Path('roblox-tools/feral-territory-rush-v4.0.lua').read_text('utf-8')
          loader=Path('roblox-tools/feral-nova-territory-rush.lua').read_text('utf-8')
          assert 'FERAL_TERRITORY_RUSH_V4' in source
          assert 'toggleTerritoryAuto' in source
          assert 'env.FERAL_TERRITORY_RUSH_V4={' in source
          for item in ('AutoCare','careButton','careTick','careHuntEnabled','bestNPCFood',
                       'safeWaterEdge','Hunger','Thirst','FeedCan','sendKeyE','sendNativeBite',
                       'SCENT_TRIGGER','landingCache','retryCooldown','lastEvidenceAt',
                       'value(a.key,"owner")==myPack','careProfiles','careConnection'):
              assert item in source, f'missing: {item}'
          assert 'terr:SetAttribute(' not in source, 'must not fake server ownership'
          assert 'other players can still see' in source, 'cannot fake true invisibility'
          assert 'feral-territory-rush-v4.0.lua' in loader
          assert 'feral-nova-v13.5.7-eagle-talon-hover-fix-experimental-potassium.lua' in loader
          assert "game.PlaceId~=GAME" in loader, 'must guard game place'
          print('FERAL_TERRITORY_RUSH_V4_STATIC_PASS')
          PY
      - name: Install official Luau compiler
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 --max-time 90 'https://github.com/luau-lang/luau/releases/download/0.747/luau-ubuntu.zip' -o /tmp/luau.zip
          mkdir -p /tmp/feral-rush-luau
          unzip -q /tmp/luau.zip -d /tmp/feral-rush-luau
          luau="$(find /tmp/feral-rush-luau -type f -name luau-compile | head -n 1)"
          test -n "$luau"
          chmod +x "$luau"
          echo "LUAU_COMPILER=$luau" >> "$GITHUB_ENV"
      - name: Compile territory and combined launcher
        run: |
          set -euo pipefail
          "$LUAU_COMPILER" --null roblox-tools/feral-territory-rush-v4.0.lua
          "$LUAU_COMPILER" --null roblox-tools/feral-nova-territory-rush.lua
          echo FERAL_TERRITORY_RUSH_V4_LUAU_COMPILE_PASS
