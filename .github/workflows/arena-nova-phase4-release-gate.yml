name: ARENA NOVA hub release gate
on:
  push:
    branches: [main]
    paths:
      - 'roblox-tools/arena-nova-hub-v1.0.lua'
      - 'roblox-tools/arena-nova-hub-v1.1.lua'
      - 'roblox-tools/arena-nova-hub-v1.2.lua'
      - 'roblox-tools/arena-nova-hub-v1.2.1.lua'
      - 'roblox-tools/arena-nova-hub-v1.3.lua'
      - 'roblox-tools/arena-nova-hub-v1.4.lua'
      - 'roblox-tools/arena-nova.lua'
      - '.github/workflows/arena-nova-phase4-release-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-and-syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Assert hub identity and no source-harvesting tools
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('roblox-tools/arena-nova-hub-v1.4.lua')
          if not p.exists():
              raise SystemExit('Expected Arena NOVA Phase4 hub source has not been published yet')
          s=p.read_text('utf-8-sig')
          stable=Path('roblox-tools/arena-nova.lua')
          assert stable.exists(), 'Stable Arena NOVA script not published'
          assert stable.read_text('utf-8-sig') == s, 'Stable launcher is out of sync with versioned source'
          # Core edition: no gameplay-affecting trials, perk actions or research UI.
          forbidden_core = (
              'TRIAL_REACH_OFFSET',
              'startStaminaTrial',
              'startKnockbackTrial',
              'PerkAction',
              'requestOwnedPerk',
              'stopAllTrials',
              'researchPage',
              'tabButtons',
              'SwingFired',
              'setTrial',
          )
          for token in forbidden_core:
              assert token not in s, f'non-core feature still present: {token}'
          assert 'CORE EDITION' in s, 'Core-only identity missing'
          assert 'ALL OFF' in s and 'RESTORE' in s, 'Quick off/restore missing'
          assert 'gui:FindFirstChild("PlayerName", true)' in s, 'name cleanup not hardened'
          assert 'reachReadElapsed' in s, 'reach lookups not throttled'
          assert 'Enum.RenderPriority.Camera.Value + 1' in s, 'aim not ordered after Roblox camera'
          assert 'WorldToViewportPoint' in s, 'aim selection must use screen projection'
          assert 'UserInputService:IsMouseButtonPressed(Enum.UserInputType.MouseButton2)' in s, 'aim must be hold-to-use'
          assert 'closestToCrosshair' in s, 'aim selector missing'
          assert 'stopAim()' in s and 'UnbindFromRenderStep' in s, 'aim cleanup missing'
          assert 'RIGHT-CLICK AIM' in s and 'aim = true' in s, 'aim toggle missing'
          for expected in (
              '7209131331',
              'RightShift',
              'FillTransparency',
              'OutlineTransparency',
              'Highlight',
              'DisplayName',
              'CharacterAdded',
              'GetAttribute',
              'MaxDistance = 0',
              'reachModel:PivotTo',
              'ALL OFF',
              'RESTORE',
              'queue_on_teleport',
          ):
              assert expected in s, f'missing approved-feature invariant: {expected}'
          for forbidden in (
              'getscriptbytecode(',
              'getgc(',
              'decompile(',
              'getconnections(',
              'writefile(',
              'setclipboard(',
              'loadstring(game:HttpGet("https://raw.githubusercontent.com/GSVexed/chatgpt-minecraft-testlab',
          ):
              assert forbidden not in s, f'unexpected diagnostic/source extraction tool: {forbidden}'
          print('ARENA_NOVA_CORE_STATIC_GATE_PASS')
          PY
      - name: Install official Luau compiler
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 --max-time 90 \
            'https://github.com/luau-lang/luau/releases/download/0.747/luau-ubuntu.zip' \
            -o /tmp/arena-phase4-luau.zip
          mkdir -p /tmp/arena-phase4-luau
          unzip -q /tmp/arena-phase4-luau.zip -d /tmp/arena-phase4-luau
          compiler="$(find /tmp/arena-phase4-luau -type f -name luau-compile | head -1)"
          test -n "$compiler"
          chmod +x "$compiler"
          echo "LUAU_COMPILER=$compiler" >> "$GITHUB_ENV"
      - name: Compile complete authored hub source
        shell: bash
        run: |
          set -euo pipefail
          "$LUAU_COMPILER" --null roblox-tools/arena-nova-hub-v1.4.lua
          echo ARENA_NOVA_CORE_LUAU_COMPILE_PASS
