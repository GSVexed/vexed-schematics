name: ARENA NOVA Phase 4 hub release gate
on:
  push:
    branches: [main]
    paths:
      - 'roblox-tools/arena-nova-hub-v1.0.lua'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-and-syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Assert hub identity and no source-harvesting tools
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('roblox-tools/arena-nova-hub-v1.0.lua')
          if not p.exists():
              raise SystemExit('Expected Arena NOVA Phase4 hub source has not been published yet')
          s=p.read_text('utf-8-sig')
          for expected in (
              '7209131331',
              'RightShift',
              'FillTransparency',
              'OutlineTransparency',
              'Highlight',
              'DisplayName',
              'CharacterAdded',
              'GetAttribute',
          ):
              assert expected in s, f'missing approved-feature invariant: {expected}'
          for forbidden in (
              'getscriptbytecode(',
              'getgc(',
              'decompile(',
              'getconnections(',
              'writefile(',
              'setclipboard(',
              'loadstring(game:HttpGet("https://raw.githubusercontent.com/GSVexed/chatgpt-minecraft-testlab',
          ):
              assert forbidden not in s, f'unexpected diagnostic/source extraction tool: {forbidden}'
          print('ARENA_NOVA_PHASE4_STATIC_GATE_PASS')
          PY
      - name: Install official Luau compiler
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 --max-time 90 \
            'https://github.com/luau-lang/luau/releases/download/0.747/luau-ubuntu.zip' \
            -o /tmp/arena-phase4-luau.zip
          mkdir -p /tmp/arena-phase4-luau
          unzip -q /tmp/arena-phase4-luau.zip -d /tmp/arena-phase4-luau
          compiler="$(find /tmp/arena-phase4-luau -type f -name luau-compile | head -1)"
          test -n "$compiler"
          chmod +x "$compiler"
          echo "LUAU_COMPILER=$compiler" >> "$GITHUB_ENV"
      - name: Compile complete authored hub source
        shell: bash
        run: |
          set -euo pipefail
          "$LUAU_COMPILER" --null roblox-tools/arena-nova-hub-v1.0.lua
          echo ARENA_NOVA_PHASE4_LUAU_COMPILE_PASS
