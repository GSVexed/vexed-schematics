name: FERAL NOVA v10.3 Moving Recovery - 23 Modules and Deep Regression
on:
  push:
    branches: [main]
    paths:
      - 'roblox-tools/feral-nova-v10.0-release-candidate-potassium.lua'
      - 'roblox-tools/feral-nova-v10.0-potassium.lua'
      - 'roblox-tools/feral-nova-v10.2-hotfix-potassium.lua'
      - 'roblox-tools/feral-nova-v10.3-moving-recovery-potassium.lua'
      - 'roblox-tools/feral-nova-native-recovery-v10.3.lua'
      - 'roblox-tools/feral-nova-evidence-v10.0.lua'
      - 'roblox-tools/feral-nova-ui-v10.0.lua'
      - 'roblox-tools/feral-nova-afk-v10.1.lua'
      - 'roblox-tools/feral-nova-grab-v10.1.lua'
      - '.github/workflows/feral-nova-v10.0-validate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install official Luau compiler and interpreter
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 --max-time 90 'https://github.com/luau-lang/luau/releases/download/0.747/luau-ubuntu.zip' -o /tmp/feral-luau.zip
          mkdir -p /tmp/feral-luau
          unzip -q /tmp/feral-luau.zip -d /tmp/feral-luau
          c="$(find /tmp/feral-luau -type f -name luau-compile | head -n 1)"
          test -n "$c"
          chmod +x "$c"
          t="$(dirname "$c")/luau"
          test -f "$t"
          chmod +x "$t"
          echo "LUAU_COMPILER=$c" >> "$GITHUB_ENV"
          echo "LUAU_RUNNER=$t" >> "$GITHUB_ENV"
      - name: Audit 23 modules — v10.3 pose ownership and all launcher preflight names
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path("roblox-tools")
          before=(root/"feral-nova-v9.0-core-preview-potassium.lua").read_text()
          after=(root/"feral-nova-v10.0-release-candidate-potassium.lua").read_text()
          release=(root/"feral-nova-v10.0-potassium.lua").read_text()
          fresh=(root/"feral-nova-v10.2-hotfix-potassium.lua").read_text()
          assert release==after.replace(
              "-- FERAL NOVA v10.0 RELEASE CANDIDATE /",
              "-- FERAL NOVA v10.0 RELEASE /",1), "Canonical release diverged from tested bundle"
          expected_fresh=release.replace(
              "-- FERAL NOVA v10.0 RELEASE /",
              "-- FERAL NOVA v10.2 CACHE-FRESH RELEASE /",1
          ).replace('version="10.0.0"','version="10.2.0"').replace(
              'activeRecord.version="feral-nova-v10.0"',
              'activeRecord.version="feral-nova-v10.2"')
          assert fresh==expected_fresh, "Cache-safe v10.2 URL diverges from verified canonical bundle"
          assert 'name="FERAL HUB",version="10.2.0"' in fresh
          visual=(root/"feral-nova-v10.3-moving-recovery-potassium.lua").read_text()
          visual_native=(root/"feral-nova-native-recovery-v10.3.lua").read_text().rstrip()
          assert 'name="FERAL HUB",version="10.3.0"' in visual
          assert 'feral-nova-native-recovery-v10.2.lua' not in visual
          assert '-- FERAL NOVA v10.3 MOVING-RECOVERY POSE FIX /' in visual
          pat=r'\["([^"]+\.lua)"\]=\[==========\[\n(.*?)\n\]==========\]'
          old=dict(re.findall(pat,before,re.S))
          new=dict(re.findall(pat,after,re.S))
          assert len(old)==22 and len(new)==23
          # Runtime preflight must resolve EVERY name against BUNDLED.
          # Full Luau compilation alone cannot catch a stale literal
          # MODULE_ORDER string because the missing lookup occurs at runtime.
          order_match=re.search(r'local MODULE_ORDER=\{([^\n]+)\}',after)
          assert order_match is not None,"MODULE_ORDER missing"
          order=re.findall(r'"([^"]+\.lua)"',order_match.group(1))
          assert len(order)==23,"Expected 23 ordered modules"
          assert len(order)==len(set(order)),"Duplicate preflight module name"
          assert set(order)==set(new),f"Preflight lookup mismatch: missing={set(order)-set(new)}, unordered={set(new)-set(order)}"
          # Both the compile order and runtime get() must use embedded names.
          gets=re.findall(r'\bget\("([^"]+\.lua)"\)',after)
          assert gets and set(gets).issubset(set(new)),f"Runtime get() references missing: {set(gets)-set(new)}"
          assert all(len(new[name])>100 for name in order)
          visual_modules=dict(re.findall(pat,visual,re.S))
          assert len(visual_modules)==23
          assert visual_modules["feral-nova-native-recovery-v10.3.lua"]==visual_native
          assert set(visual_modules)==(set(new)-{"feral-nova-native-recovery-v10.2.lua"})|{"feral-nova-native-recovery-v10.3.lua"}
          for name in set(visual_modules)&set(new):
              assert visual_modules[name]==new[name],f"v10.3 changed unrelated module: {name}"
          assert 'delayedAutoRestEchoesMasked' in visual_native
          assert 'N.active and N.owned==char' in visual_native
          assert 'RunService.PreAnimation' in visual_native
          for label,payload in [("canonical",release),("cache_safe",fresh),("visual_v103",visual)]:
              embedded=dict(re.findall(pat,payload,re.S))
              ordered=re.search(r'local MODULE_ORDER=\{([^\n]+)\}',payload)
              assert ordered is not None,f"{label}: missing MODULE_ORDER"
              names=re.findall(r'"([^"]+\.lua)"',ordered.group(1))
              required=re.findall(r'\bget\("([^"]+\.lua)"\)',payload)
              assert len(names)==23 and len(embedded)==23,f"{label}: invalid module count"
              assert set(names)==set(embedded),f"{label}: missing module source {set(names)-set(embedded)}"
              assert set(required).issubset(set(embedded)),f"{label}: stale get() reference"
              assert "feral-nova-native-recovery-v9.0.lua" not in payload, f"{label}: stale native recovery"
          print("FERAL_MODULE_PREFLIGHT_NAME_INTEGRITY_23_23_PASS")
          # 16 legacy bodies are byte-identical. Rest/autonomous priorities
          # have a dedicated revision with physically entered Rest preserved.
          assert set(old)-set(new)=={
              "feral-nova-ui-v9.0.lua","feral-nova-afk-v9.0.lua",
              "feral-nova-grab-v9.0.lua","feral-nova-native-recovery-v9.0.lua",
              "feral-nova-action-core-v9.0.lua",
              "feral-nova-active-recovery-v29.0.lua"}
          assert set(new)-set(old)=={
              "feral-nova-ui-v10.0.lua","feral-nova-evidence-v10.0.lua",
              "feral-nova-afk-v10.1.lua","feral-nova-grab-v10.1.lua",
              "feral-nova-native-recovery-v10.2.lua",
              "feral-nova-action-core-v10.2.lua",
              "feral-nova-active-recovery-v10.2.lua"}
          assert len(set(old)&set(new))==16
          for name in set(old)&set(new):
              assert old[name]==new[name],f"unmodified v9 module changed: {name}"
          for name in ["feral-nova-ui-v10.0.lua","feral-nova-evidence-v10.0.lua",
                       "feral-nova-afk-v10.1.lua","feral-nova-grab-v10.1.lua",
                       "feral-nova-native-recovery-v10.2.lua",
                       "feral-nova-action-core-v10.2.lua",
                       "feral-nova-active-recovery-v10.2.lua"]:
              assert new[name]==(root/name).read_text().rstrip(),f"source mismatch: {name}"
          assert 'log.preservedGameplayModules=16' in after
          assert 'H.precompiledCount==23' in after
          assert 'log.moduleCount==23' in after
          assert 'schema="FERAL_HUB_SESSION_V7",version="10.0.0"' in after
          assert 'activeRecord.version="feral-nova-v10.0"' in after
          assert 'ctx.evidence=H.attach("evidence"' in after
          assert 'ctx.evidence.close()' in after
          assert '"evidence","grabMini","afk"' in after
          assert 'v10_independent_evidence' in after
          assert 'v10_evidence_buckets' in after
          assert '"controller_evidence"' not in after or '"evidence"' in after
          assert 'game:HttpGet(' not in after
          ui=new["feral-nova-ui-v10.0.lua"]
          assert 'dashboardLayer=make("Frame"' in ui
          # Prevent release-ready false negatives when an updated UI uses a new name.
          assert 'Name="FeralNovaV100"' in ui
          assert 'H.activeUI=window' in after and 'local hub=H.activeUI' in after
          assert 'hub=pg and pg:FindFirstChild("FeralNovaPrimeV320")' not in after
          assert '"FeralNovaV100","FeralNovaPrimeV320"' in after
          # One failed controller close must not prevent remaining cleanup.
          assert 'pcall(function()Active.close()end)' in ui
          assert 'pcall(function()Tags.close()end)' in ui
          assert 'pcall(function()Escape.close()end)' in ui
          assert 'MANUAL REST / PRESERVED' in ui
          assert 'Manual Rest protected:' in ui
          assert 'pcall(clearFog)' in ui
          assert 'COPY EVIDENCE' in ui
          assert 'SURVIVAL","COMBAT","ABILITIES","SYSTEM' in ui
          assert 'Evidence.summary()' in ui
          assert 'Evidence.close()' in ui
          assert 'AFK.setSurvivalEnabled(false)' in ui
          assert 'Grab.setEnabled(true)' in ui
          evidence=new["feral-nova-evidence-v10.0.lua"]
          assert 'function Evidence.attach(ctx)' in evidence
          assert 'function E.summary()' in evidence
          assert 'function E.close()' in evidence
          assert 'maxHpChanged' in evidence and 'transitionSamples' in evidence
          assert 'survivalIncrease' in evidence and 'staminaDown' in evidence
          for prohibited in ['FireServer(', 'SetAttribute(', 'writefile(', 'game:HttpGet(', 'HttpService:PostAsync(']:
              assert prohibited not in evidence,f"evidence engine must not mutate/transmit: {prohibited}"
          dest=Path("/tmp/feral-v100-modules")
          dest.mkdir(exist_ok=True)
          for name,source in new.items(): (dest/name).write_text(source)
          print("FERAL_V102_23_MODULES_16_LEGACY_UNCHANGED_PASS")
          PY
      - name: Compile full offline hub and each bundled module
        shell: bash
        run: |
          set -euo pipefail
          "$LUAU_COMPILER" --null roblox-tools/feral-nova-v10.0-release-candidate-potassium.lua
          "$LUAU_COMPILER" --null roblox-tools/feral-nova-v10.0-potassium.lua
          "$LUAU_COMPILER" --null roblox-tools/feral-nova-v10.2-hotfix-potassium.lua
          "$LUAU_COMPILER" --null roblox-tools/feral-nova-v10.3-moving-recovery-potassium.lua
          "$LUAU_COMPILER" --null roblox-tools/feral-nova-native-recovery-v10.3.lua
          for file in /tmp/feral-v100-modules/*.lua; do
            "$LUAU_COMPILER" --null "$file"
          done
          echo FERAL_NOVA_V101_LUAU_FULL_COMPILE_PASS
      - name: Runtime mocked native Rest lifecycle and pose backoff
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          code=Path('roblox-tools/feral-nova-native-recovery-v10.3.lua').read_text()
          assert code.rstrip().endswith('return Native')
          code=code[:code.rfind('return Native')]
          before=r'''
          local now=1
          local serverNow=100
          os={clock=function()return now end}
          local function event()
            local e={fn=nil}
            function e:Connect(fn) self.fn=fn;return {Disconnect=function()end} end
            function e:Fire(...) if self.fn then self.fn(...) end end
            return e
          end
          local heartbeat=event()
          local preAnimation=event()
          local input=event()
          local focused=false
          local held=false
          local restChanges=event()
          local attrs={WolfRest=false,Species="Eagle"}
          local char={Parent=true}
          function char:GetAttribute(k)return attrs[k]end
          function char:SetAttribute(k,v)attrs[k]=v; if k=="WolfRest" then restChanges:Fire() end end
          function char:GetAttributeChangedSignal(k)return restChanges end
          local hum={Health=50,MaxHealth=100}
          function char:FindFirstChildOfClass(k) if k=="Humanoid" then return hum end end
          local pattrs={}
          local player={Character=char}
          function player:GetAttribute(k)return pattrs[k]end
          local sent={}
          local remote={}
          function remote:IsA(k)return k=="RemoteEvent"end
          function remote:FireServer(k,v)
            table.insert(sent,{k,v})
            if v==true then
              char:SetAttribute("WolfRest",true)
            end
          end
          workspace={GetServerTimeNow=function()return serverNow end}
          local services={
            Players={LocalPlayer=player},
            ReplicatedStorage={FindFirstChild=function(self,k)
              if k=="WolfActions"then return remote end
            end},
            UserInputService={
              InputBegan=input,
              GetFocusedTextBox=function()return focused and {} or nil end,
              IsMouseButtonPressed=function()return held end
            },
            RunService={
              Heartbeat=heartbeat,
              PreAnimation=preAnimation,
              BindToRenderStep=function(self,k,n,cb) self.render=cb end,
              UnbindFromRenderStep=function(self,k)self.render=nil end
            }
          }
          game={GetService=function(self,k)return services[k]end}
          Enum={UserInputType={MouseButton1=1,MouseButton2=2,Touch=3},
                KeyCode={G=9,R=10,Z=11,X=12}}
          '''
          after=r'''
          local guide={enabled=true,alive=true,ready=false,nativeReady=false}
          local context={state={alive=true},lab=guide}
          local guiHits={}
          local uiRoot={}
          context.ui=uiRoot
          local pg={GetGuiObjectsAtPosition=function()return guiHits end}
          function player:FindFirstChildOfClass(k)
            if k=="PlayerGui" then return pg end
          end
          services.UserInputService.GetMouseLocation=function()
            return {X=20,Y=20}
          end
          local N=Native.attach(context)
          assert(N.setEnabled(true)==true)
          heartbeat:Fire()
          assert(N.active and N.nativeOn==1 and N.maskWrites>=1)
          assert(attrs.WolfRest==false and N.preMaskStarts==1)
          -- Clicking this hub's own UI must not prime manual Rest intent,
          -- even if the button/label includes the word Rest.
          guiHits[1]={Name="Rest",IsDescendantOf=function(_,root)
            return root==uiRoot
          end}
          now=1.05
          input:Fire({UserInputType=Enum.UserInputType.MouseButton1,
              KeyCode=0,Position={X=20,Y=20}},true)
          assert(N.manualIntentUntil==0 and N.active)
          guiHits[1]=nil
          now=1.06
          input:Fire({UserInputType=0,KeyCode=Enum.KeyCode.R},false)
          assert(N.manualIntentUntil>now)
          -- New native Mouse1 must release server Rest even before combat tag.
          now=1.2
          input:Fire({UserInputType=Enum.UserInputType.MouseButton1,KeyCode=0},false)
          assert(not N.active and N.nativeOff==1 and N.attackRestReleases==1)
          held=true
          now=1.6
          heartbeat:Fire()
          assert(not N.active)
          held=false
          focused=true
          now=1.8
          heartbeat:Fire()
          assert(not N.active)
          focused=false
          -- Teammates within bite reach are NOT combat; recovery re-arms
          -- without depending on whether the guide sees a possible target.
          guide.nativeReady=true
          now=2.6
          heartbeat:Fire()
          assert(N.active and N.nativeOn==2)
          guide.nativeReady=false
          now=3.2
          heartbeat:Fire()
          assert(N.active and N.nativeOn==2)
          -- v8.1 only true native bite reach blocks Rest; extended local
          -- "ready" UI hints alone no longer suppress moving healing.
          guide.ready=true
          now=3.5
          heartbeat:Fire()
          assert(N.active and N.nativeOff==1)
          guide.nativeReady=true
          now=3.8
          heartbeat:Fire()
          assert(N.active and N.nativeOff==1)
          assert(N.aimedTargetRestReleases==0)
          guide.nativeReady=false
          guide.ready=false
          now=4.5
          heartbeat:Fire()
          assert(N.active and N.nativeOn==2)
          -- v10.2 bug: Rest(true) echo arriving more than 1s after our request
          -- was mistaken for manual Rest, exposing a moving physical Rest pose.
          -- This must remain auto-owned and be masked, without stopping recovery.
          now=6.2
          char:SetAttribute("WolfRest",true)
          assert(N.active and not N.manualRest and attrs.WolfRest==false)
          assert(N.delayedAutoRestEchoesMasked>=1)
          preAnimation:Fire()
          assert(N.preAnimationMaskPasses>=1)
          assert(N.mask~=nil)
          -- Legacy five-second pulse remains when wounded and not attacking.
          now=9.6
          heartbeat:Fire()
          assert(N.active and N.nativeOn==3)
          hum.Health=100
          now=14.9
          heartbeat:Fire()
          assert(N.nativeOn==3)
          pattrs.FeralCombatUntil=120
          now=15.2
          heartbeat:Fire()
          assert(not N.active and N.nativeOff==2)
          assert(N.status=="COMBAT TAG ACTIVE / REST OFF")
          serverNow=130
          now=16.2
          heartbeat:Fire()
          assert(N.active and N.nativeOn==4)
          -- Repeated synchronous own-signal echoes trigger bounded safety backoff.
          -- Echo producers stop after our controller releases Rest; don't
          -- fabricate a fourth, unrelated true change after unbinding.
          for i=1,3 do
            if N.active then char:SetAttribute("WolfRest",true) end
          end
          assert(attrs.WolfRest==false)
          assert(not N.active and N.poseRetryAt>now and N.nativeOff==3)
          now=17.2
          heartbeat:Fire()
          assert(not N.active and N.nativeOn==4)
          now=32.2
          heartbeat:Fire()
          assert(N.active and N.nativeOn==5)
          -- Integration test: shared action denial must actually
          -- release native Rest, not merely display a blocked status.
          context.action={allowed=function(mode)
            assert(mode=="recovery")
            return false,"GRAB MINIGAME"
          end}
          now=33
          heartbeat:Fire()
          assert(not N.active and N.nativeOff==4)
          assert(N.status=="ACTION POLICY / GRAB MINIGAME")
          context.action.allowed=function()return true,"SAFE"end
          now=34
          heartbeat:Fire()
          assert(N.active and N.nativeOn==6)
          -- User explicitly activates Rest while automation is armed.
          now=34.3
          guiHits[1]={Name="RestButton",IsDescendantOf=function()return false end}
          input:Fire({UserInputType=Enum.UserInputType.MouseButton1,
              KeyCode=0,Position={X=20,Y=20}},true)
          assert(N.manualIntentUntil>now)
          char:SetAttribute("WolfRest",true)
          assert(N.manualRest and not N.active and N.mask==nil)
          assert(attrs.WolfRest==true and N.nativeOff==4)
          now=34.6
          heartbeat:Fire()
          assert(N.manualRest and attrs.WolfRest==true and N.nativeOn==6)
          -- Combat or ordinary attack input MUST NOT make this controller
          -- claim ownership and send Rest(false) for player-owned Rest.
          input:Fire({UserInputType=Enum.UserInputType.MouseButton1,KeyCode=0},false)
          assert(N.manualRest and N.nativeOff==4)
          char:SetAttribute("WolfRest",false)
          now=35
          heartbeat:Fire()
          assert(not N.manualRest and N.active and N.nativeOn==7)
          N.close()
          assert(not N.active and N.nativeOff==5)
          -- The user was already resting when enabling/reloading the hub.
          -- No synthetic Rest(false) may be sent when that instance closes.
          char:SetAttribute("WolfRest",true)
          now=40
          local N2=Native.attach(context)
          assert(N2.setEnabled(true)==true)
          heartbeat:Fire()
          assert(N2.manualRest and not N2.active and N2.nativeOn==0)
          assert(attrs.WolfRest==true)
          N2.close()
          assert(N2.nativeOff==0 and attrs.WolfRest==true)
          print("FERAL_NOVA_V103_MOVING_AUTO_REST_LATE_ECHO_MASK_PASS")
          '''
          Path('/tmp/feral-v90-native-test.luau').write_text(before+code+after)
          PY
          "$LUAU_RUNNER" /tmp/feral-v90-native-test.luau
      - name: Runtime mock — recovery status transitions manual Rest, auto recovery, combat pause
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          code=Path('roblox-tools/feral-nova-active-recovery-v10.2.lua').read_text()
          assert code.rstrip().endswith('return Active')
          code=code[:code.rfind('return Active')]
          before=r'''
          local now=1
          os={clock=function()return now end}
          local heartbeat={}
          function heartbeat:Connect(fn)
              self.fn=fn
              return {Disconnect=function()end}
          end
          function heartbeat:Fire()if self.fn then self.fn()end end
          local hum={Health=50,MaxHealth=100}
          local char={FindFirstChildOfClass=function(self,k)return hum end}
          local player={Character=char}
          local services={RunService={Heartbeat=heartbeat},Players={LocalPlayer=player}}
          game={GetService=function(self,k)return services[k]end}
          '''
          after=r'''
          local native={enabled=true,manualRest=true,active=false,poseSafetyPauses=0}
          function native.setEnabled(v)native.enabled=v==true end
          local regen={needsApplied=true,statusApplied=true,restMultipliersReady=true}
          function regen.setEnabled(v)regen.enabled=v==true end
          local ctx={native=native,regen=regen,
              recovery={enabled=false},mobile={enabled=false}}
          local A=Active.attach(ctx)
          assert(A.setEnabled(true)==true)
          assert(A.mode=="MANUAL_REST")
          assert(A.status:find("GAME CONTROLS POSE",1,true))
          assert(A.report():find("manual_rest_preserved=true",1,true))
          now=2
          heartbeat:Fire()
          assert(A.reasonSeconds.MANUAL_REST>0)
          assert(A.woundedBlockedSeconds==0 and A.nativeActiveSeconds==0)
          native.manualRest=false
          native.active=true
          now=3
          heartbeat:Fire()
          assert(A.mode=="NATIVE_RECOVERY" and A.nativeActiveSeconds>0)
          native.active=false
          native.status="COMBAT TAG ACTIVE / REST OFF"
          now=4
          heartbeat:Fire()
          assert(A.mode=="COMBAT_BLOCKED" and A.combatBlockedSeconds>0)
          A.close()
          assert(not A.alive and native.enabled==false)
          print("FERAL_NOVA_V102_ACTIVE_RECOVERY_MODE_TRANSITIONS_PASS")
          '''
          Path('/tmp/feral-v102-active-test.luau').write_text(before+code+after)
          PY
          "$LUAU_RUNNER" /tmp/feral-v102-active-test.luau
      - name: Mock platform idle pulses and survival safe default
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          code=Path('roblox-tools/feral-nova-afk-v10.1.lua').read_text()
          assert code.rstrip().endswith('return AFK')
          code=code[:code.rfind('return AFK')]
          before=r'''
          local t=0
          os={clock=function()return t end}
          local function event()
            local v={}
            function v:Connect(fn)self.fn=fn;return{Disconnect=function()end}end
            function v:Fire(...)if self.fn then self.fn(...)end end
            return v
          end
          local heartbeat=event()
          local input=event()
          local changed=event()
          local idled=event()
          local pulseCount=0
          Enum={UserInputType={MouseMovement=1,MouseWheel=2,
              MouseButton2=3,Keyboard=4,MouseButton1=5,Touch=6}}
          local player={Idled=idled,Character=nil}
          function player:GetAttribute(k)return nil end
          local virtual={}
          function virtual:CaptureController()end
          function virtual:ClickButton2(pos)pulseCount+=1 end
          local services={
            Players={LocalPlayer=player},
            UserInputService={InputBegan=input,InputChanged=changed},
            RunService={Heartbeat=heartbeat},
            ReplicatedStorage={FindFirstChild=function()return nil end},
            VirtualUser=virtual
          }
          game={GetService=function(self,k)return services[k]end}
          Vector2={new=function(x,y)return{x=x,y=y}end}
          '''
          after=r'''
          local A=AFK.attach({
            state={alive=true},
            action={snapshot=function()return {char=nil,root=nil,hum=nil,blocked=true} end}
          })
          assert(A.robloxEnabled==false and A.survivalEnabled==false)
          assert(A.setRobloxEnabled(true)==true)
          t=86
          heartbeat:Fire()
          assert(A.pulseAttempts==1 and A.pulseSuccess==1 and pulseCount==1)
          idled:Fire(120)
          assert(A.idledEvents==1 and A.pulseSuccess==2)
          -- Synthetic mouse events may be filtered, but real keys may NOT.
          input:Fire({UserInputType=Enum.UserInputType.MouseButton2})
          changed:Fire({UserInputType=Enum.UserInputType.MouseMovement})
          assert(A.lastPhysicalInputAt==0)
          input:Fire({UserInputType=Enum.UserInputType.Keyboard})
          assert(A.lastPhysicalInputAt==86)
          t=86.1
          input:Fire({UserInputType=Enum.UserInputType.MouseButton1})
          assert(A.lastPhysicalInputAt==t)
          -- Even during the pulse-suppression interval, a real key must
          -- immediately halt any already-started autonomous movement.
          A.travelActive=true
          t=86.2
          input:Fire({UserInputType=Enum.UserInputType.Keyboard})
          assert(A.lastPhysicalInputAt==t and not A.travelActive)
          assert(A.userStopCount==1)
          -- Genuine mouse movement after the short synthetic window
          -- also cancels auto travel, rather than merely noting activity.
          A.travelActive=true
          t=86.4
          changed:Fire({UserInputType=Enum.UserInputType.MouseMovement})
          assert(A.lastPhysicalInputAt==t and not A.travelActive)
          assert(A.userStopCount==2)
          A.setSurvivalEnabled(true)
          t=151
          heartbeat:Fire()
          assert(A.survivalStatus=="WAITING FOR ANIMAL")
          assert(A.survivalMoves==0)
          A.setSurvivalEnabled(false)
          A.close()
          idled:Fire(155)
          heartbeat:Fire()
          assert(A.pulseSuccess==2 and A.alive==false)
          print("FERAL_NOVA_V101_REAL_INPUT_NOT_HIDDEN_BY_IDLE_PULSE_PASS")
          '''
          Path('/tmp/feral-v90-afk-test.luau').write_text(before+code+after)
          PY
          "$LUAU_RUNNER" /tmp/feral-v90-afk-test.luau
      - name: Runtime mock — server-issued Grab V2 Perfect crossings, no fabricated results
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src=Path('roblox-tools/feral-nova-grab-v10.1.lua').read_text()
          assert src.rstrip().endswith('return Grab')
          src=src[:src.rfind('return Grab')]
          before=r'''
          local now=10.01
          os={clock=function()return now end}
          local function event()
            local ev={}
            function ev:Connect(fn)self.fn=fn;return {Disconnect=function()end}end
            function ev:Fire(...) if self.fn then self.fn(...)end end
            return ev
          end
          local inbound=event()
          local input=event()
          local heartbeat=event()
          local sent={}
          local remote={OnClientEvent=inbound,Parent=true}
          function remote:IsA(k)return k=="RemoteEvent"end
          function remote:FireServer(...)
            sent[#sent+1]={...}
          end
          local char={}
          local hum={Health=100}
          function char:FindFirstChildOfClass(k)
            if k=="Humanoid" then return hum end
          end
          local player={Character=char}
          function player:GetAttribute(k)return nil end
          local services={
            Players={LocalPlayer=player},
            ReplicatedStorage={FindFirstChild=function(self,k)
              if k=="FeralGrabV2" then return remote end
              return nil
            end},
            UserInputService={
              InputBegan=input,
              GetFocusedTextBox=function()return false end,
            },
            RunService={Heartbeat=heartbeat},
            Workspace={GetServerTimeNow=function()return now end}
          }
          game={GetService=function(self,k)return services[k]end}
          Enum={UserInputType={MouseButton1=1,Touch=2},KeyCode={Space=3}}
          '''
          after=r'''
          local native={released=0}
          function native.beforeMinigame()native.released+=1 end
          local G=Grab.attach({state={alive=true},native=native})
          assert(G.enabled==false)
          G.setEnabled(true)
          assert(G.remoteBinds==1)
          -- No unsolicited server presses, even while enabled.
          heartbeat:Fire()
          assert(#sent==0)
          inbound:Fire("strike",{f=105,k=2,t0=10,spd=1,from=0,zc=.5,zw=.215,dur=2.5})
          assert(G.activeSession and G.pending and native.released==1)
          now=10.50
          heartbeat:Fire()
          assert(#sent==1 and sent[1][1]=="press")
          assert(sent[1][2]==105 and sent[1][3]==2)
          assert(sent[1][4]==now)
          assert(G.pressesSent==1 and G.perfectWindowAtPress==1)
          -- Practice mode (negative session ID) cannot send a game press.
          inbound:Fire("end",{})
          inbound:Fire("strike",{f=-1,k=3,t0=11,spd=1,from=0,zc=.4,zw=.215,dur=2.5})
          assert(#sent==1 and G.skippedMissingId==1)
          inbound:Fire("strike",{f="-2",k=9,t0=11,spd=1,from=0,zc=.4,zw=.215,dur=2.5})
          assert(#sent==1 and G.skippedMissingId==2)
          -- If the user presses manually, let native HUD handle it.
          now=11.03
          inbound:Fire("strike",{f=108,k=4,t0=11,spd=1,from=0,zc=.5,zw=.215,dur=2.5})
          assert(G.pending~=nil)
          input:Fire({UserInputType=1,KeyCode=0},false)
          assert(G.pending==nil and G.manualOverrides==1)
          -- An abandoned session may not survive an animal respawn.
          inbound:Fire("strike",{f=109,k=8,t0=11,spd=1,from=0,zc=.5,zw=.215,dur=2.5})
          assert(G.pending and G.activeSession and G.sessionCharacter==char)
          local newChar={}
          function newChar:FindFirstChildOfClass(k)
            if k=="Humanoid" then return hum end
          end
          player.Character=newChar
          heartbeat:Fire()
          assert(G.pending==nil and G.activeSession==false)
          player.Character=char
          now=11.04
          inbound:Fire("strike",{f=111,k=10,t0=11,spd=1,from=0,zc=.5,zw=.215,dur=2.5})
          assert(G.activeSession and G.pending)
          hum.Health=0
          heartbeat:Fire()
          assert(G.pending==nil and G.activeSession==false)
          hum.Health=100
          G.close()
          now=12
          heartbeat:Fire()
          inbound:Fire("strike",{f=110,k=5,t0=12,spd=1,from=0,zc=.5,zw=.215,dur=2.5})
          assert(#sent==1)
          print("FERAL_NOVA_V101_GRAB_PRACTICE_SESSION_AND_RESPAWN_GUARDS_PASS")
          '''
          Path('/tmp/feral-v90-grab-test.luau').write_text(before+src+after)
          PY
          "$LUAU_RUNNER" /tmp/feral-v90-grab-test.luau
      - name: Runtime mock — central policy priorities, live bite, timed leases and closure
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          code=Path('roblox-tools/feral-nova-action-core-v10.2.lua').read_text()
          assert code.rstrip().endswith('return Coordinator')
          code=code[:code.rfind('return Coordinator')]
          before=r'''
          local clock=10
          local serverClock=100
          os={clock=function()return clock end}
          workspace={GetServerTimeNow=function()return serverClock end}
          local held=false
          local focused=nil
          local attrs={}
          local pattrs={}
          local hum={Health=90,MaxHealth=100,Sit=false,PlatformStand=false}
          function hum:GetState()return{Name="Running"}end
          local root={Position=true}
          local char={Parent=true}
          function char:FindFirstChildOfClass(k)if k=="Humanoid"then return hum end end
          function char:FindFirstChild(k)if k=="HumanoidRootPart"then return root end end
          function char:GetAttribute(k)return attrs[k]end
          local player={Character=char}
          function player:GetAttribute(k)return pattrs[k]end
          local services={
            Players={LocalPlayer=player},
            UserInputService={
              GetFocusedTextBox=function()return focused end,
              IsMouseButtonPressed=function(self,k)return held end,
            },
          }
          game={GetService=function(self,k)return services[k]end}
          Enum={UserInputType={MouseButton1=1,MouseButton2=2}}
          '''
          after=r'''
          local guide={alive=true,enabled=true,nativeReady=false,ready=false}
          local context={
            lab=guide,
            grabMini={activeSession=false},
            afk={travelActive=false},
          }
          local A=Coordinator.attach(context)
          assert(A.alive and A.allowed("recovery")==true)
          -- Already-held prey is not a new G/carry input. Preserve
          -- noncombat healing while stationary or moving with prey.
          context.carry={classify=function(char)return "HOLDING PREY",true,false end}
          assert(A.allowed("recovery")==true)
          assert(A.allowed("afk_walk")==false)
          context.carry=nil
          -- Extended/experimental client bite range MUST NOT suppress Rest.
          guide.ready=true
          assert(A.allowed("recovery")==true)
          assert(A.allowed("afk_walk")==false)
          guide.nativeReady=true
          local allowed,why=A.allowed("recovery")
          assert(allowed and why=="SAFE")
          assert(A.snapshot(true).nativeBite==true)
          guide.nativeReady=false
          guide.ready=false
          held=true
          assert(A.allowed("recovery")==false)
          held=false
          pattrs.FeralCombatUntil=110
          assert(A.allowed("recovery")==false)
          pattrs.FeralCombatUntil=nil
          attrs.FeralPinned=true
          assert(A.allowed("afk_walk")==false)
          attrs.FeralPinned=nil
          -- A genuine grab reserves priority and allows only native press.
          context.grabMini.activeSession=true
          assert(A.reserve("minigame",4)==true)
          assert(A.allowed("recovery")==false)
          assert(A.allowed("afk_walk")==false)
          assert(A.allowed("grab_press")==true)
          assert(A.allowed("escape")==false)
          assert(A.allowed("carry")==false)
          context.grabMini.activeSession=false
          assert(A.allowed("grab_press")==false)
          assert(A.release("minigame")==true)
          assert(A.allowed("recovery")==true)
          assert(A.allowed("escape")==true)
          assert(A.allowed("carry")==true)
          assert(A.reserve("afk_walk",5)==true)
          assert(A.allowed("recovery")==false)
          assert(A.reserve("minigame",3)==true)
          assert(A.reserve("afk_walk",3)==false)
          clock=14
          assert(A.allowed("recovery")==true)
          assert(A.expiredLeases>=1)
          assert(A.allowed("climb")==true)
          local report=A.report()
          assert(report:find("native_bite_proximity_does_not_preempt_rest=true",1,true))
          A.close()
          assert(A.allowed("recovery")==false)
          print("FERAL_NOVA_V102_ACTION_POLICY_AND_LEASES_MOCK_PASS")
