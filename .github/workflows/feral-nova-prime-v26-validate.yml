name: FERAL NOVA PRIME v26 - full source and diagnostic regression
on:
  push:
    branches: [main]
    paths:
      - 'roblox-tools/feral-nova-prime-standalone-v26.0.lua'
      - 'roblox-tools/feral-nova-prime-ui-v26.0.lua'
      - 'roblox-tools/feral-nova-diagnostics-v26.0.lua'
      - '.github/workflows/feral-nova-prime-v26-validate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install official Luau v0.747 tools
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 2 --max-time 90             'https://github.com/luau-lang/luau/releases/download/0.747/luau-ubuntu.zip'             -o /tmp/feral-luau-v26.zip
          mkdir -p /tmp/feral-luau-v26
          unzip -q /tmp/feral-luau-v26.zip -d /tmp/feral-luau-v26
          compiler="$(find /tmp/feral-luau-v26 -type f -name luau-compile | head -n 1)"
          test -n "$compiler"
          chmod +x "$compiler"
          luau="$(dirname "$compiler")/luau"
          chmod +x "$luau"
          echo "COMPILER=$compiler" >> "$GITHUB_ENV"
          echo "LUAU=$luau" >> "$GITHUB_ENV"
      - name: Compile standalone and all 17 module sources
        shell: bash
        run: |
          set -euo pipefail
          for f in             roblox-tools/feral-aurora-engine-v13.0.lua             roblox-tools/feral-aurora-power-v14.0.lua             roblox-tools/feral-nova-escape-v15.0.lua             roblox-tools/feral-nova-combat-v15.0.lua             roblox-tools/feral-nova-recovery-v15.0.lua             roblox-tools/feral-nova-mobile-v15.0.lua             roblox-tools/feral-nova-carry-v15.0.lua             roblox-tools/feral-nova-tags-v8.0.lua             roblox-tools/feral-nova-reach-v14.0.lua             roblox-tools/feral-nova-regen-v15.0.lua             roblox-tools/feral-nova-flight-v15.0.lua             roblox-tools/feral-nova-native-recovery-v15.0.lua             roblox-tools/feral-nova-baby-v15.0.lua             roblox-tools/feral-nova-climb-v15.0.lua             roblox-tools/feral-nova-mechanics-v25.0.lua             roblox-tools/feral-nova-diagnostics-v26.0.lua             roblox-tools/feral-nova-prime-ui-v26.0.lua             roblox-tools/feral-nova-prime-standalone-v26.0.lua; do
            "$COMPILER" --null "$f"
          done
          echo V26_17_MODULES_COMPILE_PASS
      - name: Exact module preservation and privacy invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('roblox-tools')
          old=(root/'feral-nova-prime-standalone-v15.0.lua').read_text()
          v25=(root/'feral-nova-prime-standalone-v25.0.lua').read_text()
          v26=(root/'feral-nova-prime-standalone-v26.0.lua').read_text()
          pattern=r'\["([^"]+)"\]=\[==========\[\n(.*?)\n\]==========\]'
          baseline=dict(re.findall(pattern,old,re.S))
          b25=dict(re.findall(pattern,v25,re.S))
          bundle=dict(re.findall(pattern,v26,re.S))
          assert len(baseline)==15 and len(b25)==16 and len(bundle)==17
          for name,src in baseline.items():
              if name!='feral-nova-prime-ui-v15.0.lua':
                  assert bundle.get(name)==src,('Lost v15 system',name)
          assert bundle['feral-nova-mechanics-v25.0.lua']==b25['feral-nova-mechanics-v25.0.lua']
          for name,src in bundle.items():
              assert src==(root/name).read_text(),('Standalone drift',name)
          ui=bundle['feral-nova-prime-ui-v26.0.lua']
          diag=bundle['feral-nova-diagnostics-v26.0.lua']
          assert 'ctx.diag=diagnostics.attach(ctx)' in v26
          assert 'ctx.diag.close()' in v26
          assert 'Diag.close()' in ui
          assert 'Diag.report()' in ui and 'Diag.save()' in ui and 'Diag.copy()' in ui
          assert 'AUTO SAVE EVERY 25s' in ui
          assert 'Enum.KeyCode.RightShift' in ui and 'Enum.KeyCode.End' in ui
          assert 'REGEN 2x / 4x' in ui and 'Q CLIMB ON' in ui
          assert 'FeralNovaPrimeV260' in ui
          assert 'WolfDbgNoStamina' in v26
          assert 'CLOT' in v26 and 'FADE' in v26 and 'HEAL' in v26
          assert 'FeralPinned' in v26 and 'FeralClimbTap' in v26
          assert 'noDrain=yes(attribute(char,"WolfDbgNoStamina"))' in diag
          assert 'GetServerTimeNow()' in diag
          assert 'statusCleared' in diag and 'modes={}' in diag
          for forbidden in ('UserId','player.Name','player.DisplayName','Chat','HttpPost','request({','syn.request','http_request','Webhook'):
              assert forbidden not in diag,('Possible privacy problem',forbidden)
          assert 'TRANSFER=REMOTE' not in diag
          assert 'LOCAL_FILE_ONLY_NO_NETWORK_UPLOAD' in diag
          assert 'SERVER_ACCEPTANCE=UNVERIFIED' in diag
          assert 'FERAL_NOVA_v26_session.json' in diag
          print('V26_ALL_V15_FEATURES_UNCHANGED_AND_TELEMETRY_PRIVACY_PASS')
          PY
      - name: Mocked Luau telemetry - own attributes, aggregation and save
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          source=Path('roblox-tools/feral-nova-diagnostics-v26.0.lua').read_text()
          assert source.rstrip().endswith('return Diagnostics')
          source=source[:source.rfind('return Diagnostics')]
          mock=r'''
          local clock=1
          os={clock=function() return clock end}
          local attrs={Species="Eagle",Stamina=50,StaminaMax=50,Growth=.73,
             FeralBleed=4,FeralVenomAmt=3,FeralInjury=2,WolfDbgNoStamina=true}
          local playerAttrs={FeralLungeReadyAt=110,FeralLungeCdTotal=60}
          local h={Health=50,MaxHealth=100}
          local clamp={IsA=function(self,typ)return typ=="ObjectValue"end,Value=nil}
          local char={
              GetAttribute=function(self,k)return attrs[k]end,
              FindFirstChildOfClass=function(self,k)if k=="Humanoid" then return h end end,
              FindFirstChild=function(self,k)if k=="FeralClamp" then return clamp end end
          }
          local player={
              Character=char,
              GetAttribute=function(self,k)return playerAttrs[k]end
          }
          local beat,input
          local clipboard,file,path=nil,nil,nil
          game={GetService=function(self,key)
              if key=="Players" then return {LocalPlayer=player} end
              if key=="RunService" then return {Heartbeat={
                  Connect=function(self,fn)
                      beat=fn
                      return {Disconnect=function()beat=nil end}
                  end
              }} end
              if key=="UserInputService" then return {
                  GetFocusedTextBox=function()return nil end,
                  InputBegan={Connect=function(self,fn)
                      input=fn
                      return {Disconnect=function()input=nil end}
                  end}
              }end
              if key=="HttpService" then return {
                  JSONEncode=function(self,data)
                      assert(data.summary.scope=="OWN_CHARACTER_ONLY")
                      assert(data.summary.samples>=1)
                      return '{"diagnostics":true}'
                  end
              } end
              if key=="Workspace" then return {GetServerTimeNow=function()return 100 end}end
          end}
          Enum={UserInputType={MouseButton1=1},KeyCode={Q=2,G=3,Space=4}}
          writefile=function(p,v)path=p;file=v end
          setclipboard=function(t)clipboard=t end
          '''
          cases=r'''
          local ctx={power={stamina="ENDURANCE"},native={active=false},
              regen={enabled=true,applied=true},
              mechanics={enabled={growth=false,carry=false,cooldown=false}},
              escape={enabled=true},baby={enabled=true},climb={enabled=true},
              state={flags={playerFinder=true}}}
          local D=Diagnostics.attach(ctx)
          assert(D==ctx.diag and D.autoSave)
          beat()
          assert(D.samplesTotal==1)
          clock=2
          attrs.Stamina=46
          attrs.FeralBleed=2
          attrs.FeralVenomAmt=1
          attrs.Growth=.74
          h.Health=55
          beat()
          assert(D.samplesTotal==2)
          assert(D.healthGained==5)
          assert(D.staminaLost==4)
          assert(D.statusCleared.bleed==2)
          assert(D.statusCleared.venom==2)
          assert(D.growthGained>.009)
          assert(D.modes.config_only.hpUp==5)
          input({UserInputType=Enum.UserInputType.MouseButton1,KeyCode=nil},false)
          assert(D.attackInputs==1)
          local ok,msg=D.save()
          assert(ok and file=='{"diagnostics":true}' and path=="FERAL_NOVA_v26_session.json")
          local copied=D.copy()
          assert(copied and string.find(clipboard,"HP gained=5",1,true))
          assert(string.find(D.report(),"SERVER_ACCEPTANCE=UNVERIFIED",1,true))
          D.close()
          assert(D.alive==false and beat==nil and input==nil)
          print("V26_AUTOMATIC_DIAGNOSTICS_OWN_SCOPE_SAVE_COPY_AND_CLEANUP_PASS")
          '''
          Path('/tmp/feral-v26-telemetry-test.luau').write_text(mock+source+cases)
          PY
          "$LUAU" /tmp/feral-v26-telemetry-test.luau
