name: FERAL NOVA v13.0 Renaissance - Source Verified Feeding and Final UI Regression
on:
  push:
    branches: [main]
    paths:
      - 'roblox-tools/feral-nova-v13.0-renaissance-stable-potassium.lua'
      - 'roblox-tools/feral-nova-native-recovery-v13.0.lua'
      - 'roblox-tools/feral-nova-action-core-v13.0.lua'
      - 'roblox-tools/feral-nova-climb-v13.0.lua'
      - 'roblox-tools/feral-nova-ui-v13.0.lua'
      - '.github/workflows/feral-nova-v13.0-renaissance-validate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install official Luau compiler and interpreter
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 --max-time 90 'https://github.com/luau-lang/luau/releases/download/0.747/luau-ubuntu.zip' -o /tmp/feral-luau.zip
          mkdir -p /tmp/feral-luau
          unzip -q /tmp/feral-luau.zip -d /tmp/feral-luau
          c="$(find /tmp/feral-luau -type f -name luau-compile | head -n 1)"
          test -n "$c"
          chmod +x "$c"
          t="$(dirname "$c")/luau"
          test -f "$t"
          chmod +x "$t"
          echo "LUAU_COMPILER=$c" >> "$GITHUB_ENV"
          echo "LUAU_RUNNER=$t" >> "$GITHUB_ENV"
      - name: Audit sole Rest owner, 23 dependencies, code provenance and release metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path("roblox-tools")
          old=(root/"feral-nova-v12.2-renaissance-ui-fixed-potassium.lua").read_text()
          new=(root/"feral-nova-v13.0-renaissance-stable-potassium.lua").read_text()
          pat=r'\["([^"]+\.lua)"\]=\[==========\[\n(.*?)\n\]==========\]'
          before=dict(re.findall(pat,old,re.S))
          after=dict(re.findall(pat,new,re.S))
          assert len(before)==23 and len(after)==23
          order_match=re.search(r'local MODULE_ORDER=\{([^\n]+)\}',new)
          assert order_match, "Missing preflight order"
          ordered=re.findall(r'"([^"]+\.lua)"',order_match.group(1))
          required=re.findall(r'\bget\("([^"]+\.lua)"\)',new)
          assert len(ordered)==23 and len(set(ordered))==23
          assert set(ordered)==set(after)
          assert set(required).issubset(set(after))
          replacements={
            "feral-nova-native-recovery-v12.1.lua":"feral-nova-native-recovery-v13.0.lua",
            "feral-nova-action-core-v12.0.lua":"feral-nova-action-core-v13.0.lua",
            "feral-nova-climb-v11.3.lua":"feral-nova-climb-v13.0.lua",
            "feral-nova-ui-v12.2.lua":"feral-nova-ui-v13.0.lua"
          }
          assert set(before)-set(after)==set(replacements)
          assert set(after)-set(before)==set(replacements.values())
          for name in set(before)&set(after):
              assert before[name]==after[name],f"Unexpected change in {name}"
          for name in replacements.values():
              source=(root/name).read_text().rstrip()
              assert source==after[name],f"Stale bundle source: {name}"
          rest=after["feral-nova-recovery-compat-v11.2.lua"]
          trial=after["feral-nova-mobile-compat-v11.2.lua"]
          for name,source in [("Safe Rest",rest),("Mobile A/B",trial)]:
              assert 'FireServer(' not in source,f"{name}: still sends native actions"
              assert ':Connect(' not in source,f"{name}: still registers events"
              assert 'RunService.Heartbeat:Connect' not in source,f"{name}: still starts a tick"
              assert 'legacyRetired=true' in source
          assert after["feral-nova-evidence-v11.2.lua"].count('version="11.2"')==1
          assert 'version="13.0.0"' in new
          assert 'activeRecord.version="feral-nova-v13.0"' in new
          assert 'release="13.0"' in new
          assert 'ctx.evidence.version=="11.2"' in new
          assert 'Name="FeralNovaV130"' in new
          assert 'v10.0 core + DATA evidence dashboard' not in new
          assert 'v112_single_auto_rest_writer' in new
          assert 'v112_legacy_engine_rest_retired' in new
          rest_owners=[name for name,code in after.items()
                       if 'FireServer("Rest"' in code]
          assert rest_owners==["feral-nova-native-recovery-v13.0.lua"],rest_owners
          assert 'FireServer("Rest"' not in after["feral-aurora-engine-v11.2.lua"]
          assert 'Rest(false)' not in after["feral-aurora-engine-v11.2.lua"]
          assert 'v112_effect_clearance_buckets' in new
          assert 'v113_rank_safe_action_leases' in new
          assert 'v113_flight_priority_guard' in new
          assert 'v113_eagle_native_reconnect' in new
          assert 'v113_grab_session_coherence' in new
          assert 'v1131_deferred_carry_cancel' in new
          assert 'v1131_eagle_carry_action_policy' in new
          assert 'v1132_eagle_replicated_holds' in new
          assert 'v1132_eagle_native_remote_lifecycle' in new
          assert 'v1132_eagle_target_timing' in new
          assert 'v12_eagle_talon_clock_domains' in new
          assert 'v12_grab_cross_session_strikes' in new
          assert 'v12_respawn_safe_snapshot_cache' in new
          assert 'v121_native_E_feed_priority' in new
          assert 'v122_clickable_ui_feedback' in new
          for feature in ("native","action","climb"):
              assert f'v13_{feature}_eat_drink_semantics' in new
          # Important source truth: FERAL's native client uses
          # WolfFeed="eat" or "drink", not the boolean true.
          for name in ("feral-nova-native-recovery-v13.0.lua",
                       "feral-nova-action-core-v13.0.lua",
                       "feral-nova-climb-v13.0.lua"):
              code=after[name]
              assert 'return value==true or value=="eat" or value=="drink"' in code,name
              assert 'GetAttribute("WolfFeed")==true' not in code,name
              assert 'GetAttribute("FeedCan")==true' not in code,name
              assert '.isNativeFeed=nativeFeed' in code,name
          assert 'nativeFeed(char:GetAttribute("FeedCan"))' in after["feral-nova-native-recovery-v13.0.lua"]
          assert 'nativeFeed(char:GetAttribute("WolfFeed"))' in after["feral-nova-native-recovery-v13.0.lua"]
          assert 'S.feeding=nativeFeed(char:GetAttribute("WolfFeed"))' in after["feral-nova-action-core-v13.0.lua"]
          assert 'S.feedAvailable=nativeFeed(char:GetAttribute("FeedCan"))' in after["feral-nova-action-core-v13.0.lua"]
          assert 'or nativeFeed(char:GetAttribute("WolfFeed"))' in after["feral-nova-climb-v13.0.lua"]
          assert 'N.beforeFeed("NATIVE FEED TAP / AUTO REST RELEASED")' in after["feral-nova-native-recovery-v13.0.lua"]
          # Permanent UI field-audit: avoid future nil Eagle counters
          # silently breaking the recurring UI rendering pass.
          ui=after["feral-nova-ui-v13.0.lua"]
          render=ui.split('ctx.onUI=function()',1)[1].split('ctx.onNotice=function()',1)[0]
          field_source={
            "Eagle":"feral-nova-eagle-actions-v12.0.lua",
            "Native":"feral-nova-native-recovery-v13.0.lua",
            "Action":"feral-nova-action-core-v13.0.lua",
            "Active":"feral-nova-active-recovery-v11.2.lua",
            "AFK":"feral-nova-afk-v10.1.lua",
            "Grab":"feral-nova-grab-v12.0.lua",
            "Carry":"feral-nova-carry-core-v11.3.lua",
            "Flight":"feral-nova-flight-v11.3.lua",
            "Mechanics":"feral-nova-mechanics-v28.0.lua",
            "Evidence":"feral-nova-evidence-v11.2.lua",
            "Diag":"feral-nova-diagnostics-v32.0.lua",
            "Climb":"feral-nova-climb-v13.0.lua",
            "Reach":"feral-nova-reach-v14.0.lua",
            "Baby":"feral-nova-baby-v15.0.lua",
            "Lab":"feral-nova-combat-v15.0.lua",
            "Escape":"feral-nova-escape-core-v9.0.lua",
            "Recovery":"feral-nova-recovery-compat-v11.2.lua",
            "Regen":"feral-nova-regen-v11.0.lua"
          }
          for variable,source_name in field_source.items():
              references=set(re.findall(r'\b'+variable+r'\.([A-Za-z_][A-Za-z0-9_]*)',render))
              module=after[source_name]
              unknown=[f for f in references
                       if not re.search(r'\b'+re.escape(f)+r'\b',module)]
              assert not unknown, f"{variable} UI fields absent from module: {unknown}"
          print("FERAL_V13_SOURCE_VERIFIED_FEED_UI_FIELD_AUDIT_PASS")

          assert 'function UI.eagleSummary(eagle,recoveryStatus)' in after["feral-nova-ui-v13.0.lua"]
          assert 'expTitle.Text=UI.eagleSummary(Eagle,recoveryStatus)' in after["feral-nova-ui-v13.0.lua"]
          assert 'b.MouseButton1Click:Connect(activate)' in after["feral-nova-ui-v13.0.lua"]
          assert 'local hit=btn(cardFrame,titleText,action,386,78)' in after["feral-nova-ui-v13.0.lua"]
          assert 'hit.ZIndex=2' in after["feral-nova-ui-v13.0.lua"]
          assert 'b.ZIndex=3' in after["feral-nova-ui-v13.0.lua"]
          assert 'ctx.uiInputHealth=buttonEvents' in after["feral-nova-ui-v13.0.lua"]
          assert 'Eagle.anyClampObservations' not in after["feral-nova-ui-v13.0.lua"]
          assert 'Eagle.clientOversizeClampObservations' not in after["feral-nova-ui-v13.0.lua"]
          assert 'key==Enum.KeyCode.E' in after["feral-nova-native-recovery-v13.0.lua"]
          assert 'N.feedHotkeyPreemptions+=1' in after["feral-nova-native-recovery-v13.0.lua"]
          assert 'Eagle.normalizeStamp=normalizeStamp' in after["feral-nova-eagle-actions-v12.0.lua"]
          assert 'staleStrikePackets' in after["feral-nova-grab-v12.0.lua"]
          assert 'A.lastSnapshot.char==(player and player.Character)' in after["feral-nova-action-core-v13.0.lua"]
          before_check=before.get("feral-nova-eagle-actions-v12.0.lua")
          after_check=after.get("feral-nova-eagle-actions-v12.0.lua")
          assert before_check==after_check,"Eagle must remain unchanged in v12.1"
          for field in ("actualClampObservations","actualClampHoldSeconds",
                        "nativeLungeBinds","nativeLungeRebinds",
                        "lastTargetAt","selectedTargetUpdates","serverDeadlineOverwrites"):
              assert field+"=" in after_check,f"Missing Eagle live field: {field}"
          check_section=new.split("function H.selfCheck(ctx)",1)[1].split("function H.closeSession()",1)[0]
          assert all(x not in check_section for x in (
              "anyClampObservations","ctx.eagleActions.remoteBinds"))
          assert check_section.count('add("')==53,"Unexpected startup check count"

          assert 'intendedCharacter=player.Character' in after["feral-nova-carry-core-v11.3.lua"]
          assert 'E.nativeCarryPriorityBlocks' in after["feral-nova-eagle-actions-v12.0.lua"]
          assert 'rank={minigame=100,feed=88,afk_walk=35}' in after["feral-nova-action-core-v13.0.lua"]
          assert 'pcall(ctx.action.allowed,"flight")' in after["feral-nova-flight-v11.3.lua"]
          assert 'if processed then return end' in after["feral-nova-climb-v13.0.lua"]
          assert 'staleSessionEvents' in after["feral-nova-grab-v12.0.lua"]
          assert 'bindNativeLunge()' in after["feral-nova-eagle-actions-v12.0.lua"]
          assert 'legacySafeRest' not in new
          assert 'real_server_4x_status_recovery_verified=false' in after["feral-nova-regen-v11.0.lua"]
          assert 'mode="feeding"' in after["feral-nova-native-recovery-v13.0.lua"]
          assert 'snap.afkMoving or snap.feeding' in after["feral-nova-evidence-v11.2.lua"]
          dest=Path("/tmp/feral-renaissance-v130-modules")
          dest.mkdir(exist_ok=True)
          for name,body in after.items():
              (dest/name).write_text(body+"\n")
          print("RENAISSANCE_V130_23_MODULES_19_UNCHANGED_SOLE_REST_OWNER_PASS")
          PY
      - name: Compile v13.0 launcher and all 23 embedded modules
        shell: bash
        run: |
          set -euo pipefail
          "$LUAU_COMPILER" --null roblox-tools/feral-nova-v13.0-renaissance-stable-potassium.lua
          for file in /tmp/feral-renaissance-v130-modules/*.lua; do
            "$LUAU_COMPILER" --null "$file"
          done
          echo FERAL_RENAISSANCE_V130_ALL_24_COMPILE_PASS
      - name: Runtime mocks - native feeding preempts Rest and conditions include clears
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          code=Path("roblox-tools/feral-nova-native-recovery-v13.0.lua").read_text()
          assert code.rstrip().endswith("return Native")
          code=code[:code.rfind("return Native")]
          before=r'''
          local now=1
          local serverNow=100
          os={clock=function()return now end}
          local oldTypeof=typeof
          typeof=function(v)
            if type(v)=="table" and v.__fakeVec then return "Vector3" end
            return oldTypeof(v)
          end
          local function event()
            local e={handlers={}}
            function e:Connect(fn)
              local handler={fn=fn,alive=true}
              table.insert(self.handlers,handler)
              return {Disconnect=function()handler.alive=false end}
            end
            function e:Fire(...)
              for _,handler in ipairs(self.handlers) do
                if handler.alive then handler.fn(...) end
              end
            end
            return e
          end
          local heartbeat=event()
          local preAnimation=event()
          local input=event()
          local charAdded=event()
          local restAttrs={}
          local char={Parent=true}
          local attrs={WolfRest=false,WolfFeed=false,Species="Eagle"}
          function char:GetAttribute(k)return attrs[k]end
          function char:SetAttribute(k,v)
            attrs[k]=v
            if restAttrs[k] then restAttrs[k]:Fire() end
          end
          function char:GetAttributeChangedSignal(k)
            if not restAttrs[k] then restAttrs[k]=event()end
            return restAttrs[k]
          end
          function char:FindFirstChild(k)return nil end
          local hum={Health=50,MaxHealth=100}
          function char:FindFirstChildOfClass(k)
            if k=="Humanoid"then return hum end
          end
          local pattrs={}
          local pSignals={}
          local player={Character=char,CharacterAdded=charAdded}
          function player:GetAttribute(k)return pattrs[k]end
          function player:SetAttribute(k,v)
            pattrs[k]=v
            if pSignals[k] then pSignals[k]:Fire()end
          end
          function player:GetAttributeChangedSignal(k)
            if not pSignals[k] then pSignals[k]=event()end
            return pSignals[k]
          end
          local sent={}
          local remote={}
          function remote:IsA(k)return k=="RemoteEvent"end
          function remote:FireServer(k,v)
            table.insert(sent,{k,v})
            if k=="Rest" and v==true then
              char:SetAttribute("WolfRest",true)
            end
          end
          local services={
            Players={LocalPlayer=player},
            ReplicatedStorage={FindFirstChild=function(self,k)
              if k=="WolfActions" then return remote end
            end},
            UserInputService={
              InputBegan=input,
              GetFocusedTextBox=function()return nil end,
              IsMouseButtonPressed=function()return false end
            },
            RunService={
              Heartbeat=heartbeat,PreAnimation=preAnimation,
              BindToRenderStep=function(self,k,n,cb) self.render=cb end,
              UnbindFromRenderStep=function(self,k)self.render=nil end
            }
          }
          workspace={GetServerTimeNow=function()return serverNow end}
          game={GetService=function(self,k)return services[k]end}
          Enum={UserInputType={MouseButton1=1,MouseButton2=2,Touch=3},
                KeyCode={G=9,R=10,Z=11,X=12,E=13}}
          '''
          after=r'''
          local ctx={state={alive=true}}
          local N=Native.attach(ctx)
          assert(N.setEnabled(true))
          heartbeat:Fire()
          assert(N.active and N.nativeOn==1)
          -- Native WolfFeed must release owned Rest instantly, without
          -- waiting for the next heartbeat or requiring manual Rest toggle.
          now=1.4
          char:SetAttribute("WolfFeed","eat")
          assert(not N.active and N.nativeOff==1)
          heartbeat:Fire()
          assert(N.feedStarts==1 and N.nativeOn==1)
          now=2.1
          char:SetAttribute("WolfFeed",false)
          heartbeat:Fire()
          assert(not N.active and N.feedFinishes==1)
          -- Delayed owned Rest echo must not strand the character in
          -- physical Rest or be mistaken for an intentional manual Rest.
          char:SetAttribute("WolfRest",true)
          assert(attrs.WolfRest==false) -- immediate attribute watcher
          heartbeat:Fire()
          assert(attrs.WolfRest==false)
          assert(N.feedEchoesSuppressed>=1)
          assert(not N.manualRest)
          now=2.5
          heartbeat:Fire()
          assert(not N.active and N.nativeOn==1)
          now=3.5
          heartbeat:Fire()
          assert(N.active and N.nativeOn==2)
          -- The game-native feed tap starts the same automatic priority
          -- gate before the WolfFeed animation/attribute becomes visible.
          now=3.65
          player:SetAttribute("FeralFeedTap",true)
          assert(not N.active and N.nativeOff==2 and N.feedIntentPreemptions>=2)
          now=5.2
          heartbeat:Fire()
          assert(N.active and N.nativeOn==3)
          -- Condition disappears on cure; absence means a clearing
          -- transition, not an unknown/invalid final numeric sample.
          char:SetAttribute("FeralBleed",8)
          now=5.5
          heartbeat:Fire()
          char:SetAttribute("FeralBleed",6)
          now=5.8
          heartbeat:Fire()
          char:SetAttribute("FeralBleed",nil)
          now=6.1
          heartbeat:Fire()
          assert(N.conditionRates.auto.FeralBleed)
          assert(N.conditionRates.auto.FeralBleed.cleared>=8)
          -- Player-owned manual Rest must still work and must not be
          -- cancelled by a feed intent when auto Rest no longer owns it.
          now=6.3
          input:Fire({UserInputType=0,KeyCode=Enum.KeyCode.R},false)
          char:SetAttribute("WolfRest",true)
          assert(N.manualRest and not N.active)
          local offCount=N.nativeOff
          now=6.4
          player:SetAttribute("FeralFeedTap",false)
          assert(N.nativeOff==offCount)
          N.close()
          assert(N.nativeOff==offCount)
          -- First mouse click while a native FeedCan prompt is present
          -- must preempt Rest instead of being treated solely as an attack.
          char:SetAttribute("WolfRest",false)
          now=8.0
          local N4=Native.attach(ctx)
          assert(N4.setEnabled(true))
          heartbeat:Fire()
          assert(N4.active and N4.nativeOn==1)
          char:SetAttribute("FeedCan","eat")
          now=8.3
          input:Fire({UserInputType=Enum.UserInputType.MouseButton1,
            KeyCode=0},false)
          assert(not N4.active and N4.nativeOff==1)
          assert(N4.feedIntentPreemptions>=1)
          char:SetAttribute("FeedCan",false)
          N4.close()
          -- Recovered WolfController binds the actual feed action to E
          -- through ContextActionService, which may mark input processed.
          -- The hub must release its own Rest on that E BEFORE returning.
          now=10
          char:SetAttribute("WolfRest",false)
          local N5=Native.attach(ctx)
          assert(N5.setEnabled(true))
          heartbeat:Fire()
          assert(N5.active and N5.nativeOn==1)
          assert(N5.isNativeFeed("eat") and N5.isNativeFeed("drink"))
          assert(N5.isNativeFeed(true) and not N5.isNativeFeed(false))
          -- A stray E outside a feed prompt must not disrupt recovery.
          now=10.1
          input:Fire({UserInputType=0,KeyCode=Enum.KeyCode.E},true)
          assert(N5.active and N5.feedHotkeyPreemptions==0)
          char:SetAttribute("FeedCan","drink")
          now=10.2
          input:Fire({UserInputType=0,KeyCode=Enum.KeyCode.E},true)
          assert(N5.feedHotkeyPreemptions==1)
          assert(not N5.active and N5.nativeOff==1)
          char:SetAttribute("FeedCan",false)
          now=11.8
          heartbeat:Fire()
          assert(N5.active and N5.nativeOn==2)
          N5.close()
          print("FERAL_RENAISSANCE_V121_NATIVE_E_FEED_FIRST_ACTION_PASS")
          '''
          Path("/tmp/feral-v11-native-test.luau").write_text(before+code+after)
          PY
          "$LUAU_RUNNER" /tmp/feral-v11-native-test.luau
      - name: Runtime mock - coordinator denies recovery and survival movement while feeding
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          code=Path("roblox-tools/feral-nova-action-core-v13.0.lua").read_text()
          assert code.rstrip().endswith("return Coordinator")
          code=code[:code.rfind("return Coordinator")]
          before=r'''
          local now=1
          os={clock=function()return now end}
          local char={Parent=true,attributes={WolfFeed="drink",FeedCan="eat"}}
          local root={}
          local hum={Health=50}
          function hum:GetState()return {Name="Running"}end
          function char:FindFirstChildOfClass(k)return hum end
          function char:FindFirstChild(k)
            if k=="HumanoidRootPart" then return root end
          end
          function char:GetAttribute(k)return self.attributes[k]end
          local player={Character=char}
          function player:GetAttribute(k)return nil end
          workspace={GetServerTimeNow=function()return 100 end}
          local services={
            Players={LocalPlayer=player},
            UserInputService={
              IsMouseButtonPressed=function()return false end,
              GetFocusedTextBox=function()return nil end
            }
          }
          game={GetService=function(self,k)return services[k]end}
          Enum={UserInputType={MouseButton1=1,MouseButton2=2}}
          '''
          after=r'''
          local A=Coordinator.attach({})
          local S=A.snapshot(true)
          assert(S.feeding and S.feedAvailable and S.priority=="FEEDING")
          assert(A.isNativeFeed("eat") and A.isNativeFeed("drink"))
          assert(A.isNativeFeed(true) and not A.isNativeFeed(false))
          for _,mode in ipairs({"recovery","afk_walk","climb","carry","flight"}) do
            local ok,reason=A.allowed(mode)
            assert(not ok and reason=="FEEDING / DRINKING")
          end
          char.attributes.WolfFeed=false
          assert(A.reserve("feed",1.25))
          S=A.snapshot(true)
          assert(S.priority=="FEEDING")
          local allowed,reason=A.allowed("recovery")
          assert(not allowed and reason=="FEEDING / DRINKING")
          now=3
          S=A.snapshot(true)
          assert(S.priority~="FEEDING")
          allowed,reason=A.allowed("recovery")
          assert(allowed)
          -- A lower-priority AFK reservation cannot steal a feeding lease.
          assert(A.reserve("feed",4))
          local feedExpiry=A.lease.expires
          local received,why=A.reserve("afk_walk",8)
          assert(not received and why=="FEED PRIORITY")
          assert(A.lease.owner=="feed")
          assert(A.reserve("feed",1))
          assert(A.lease.expires>=feedExpiry)
          local canFly,flyWhy=A.allowed("flight")
          assert(not canFly and flyWhy=="FEEDING / DRINKING")
          -- Real native minigame can preempt a feeding lease; AFK cannot.
          assert(A.reserve("minigame",2))
          assert(A.lease.owner=="minigame")
          received,why=A.reserve("afk_walk",8)
          assert(not received and why=="MINIGAME PRIORITY")
          assert(A.release("minigame"))
          assert(A.reserve("afk_walk",1))
          assert(A.allowed("flight")==false)
          -- Leases from a previous animal must not survive respawning.
          local nextChar={Parent=true,attributes={WolfFeed=false}}
          function nextChar:FindFirstChildOfClass(k)return hum end
          function nextChar:FindFirstChild(k)
            if k=="HumanoidRootPart"then return root end
          end
          function nextChar:GetAttribute(k)return self.attributes[k]end
          player.Character=nextChar
