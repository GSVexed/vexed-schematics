name: FERAL NOVA v13.5.3 First Bite Rest Off
on:
  push:
    branches: [main]
    paths:
      - 'roblox-tools/feral-nova-v13.5.3-first-bite-rest-off-potassium.lua'
      - 'roblox-tools/feral-nova-native-recovery-v13.5.3.lua'
      - '.github/workflows/feral-nova-v13.5.3-first-bite-validate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify only recovery changed and first-bite pass-through cleanup
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('roblox-tools')
          old=(root/'feral-nova-v13.5.2-mixpack-safe-rest-potassium.lua').read_text()
          new=(root/'feral-nova-v13.5.3-first-bite-rest-off-potassium.lua').read_text()
          pattern=r'\["([^"]+\.lua)"\]=\[==========\[\n(.*?)\n\]==========\]'
          before=dict(re.findall(pattern,old,re.S))
          after=dict(re.findall(pattern,new,re.S))
          assert len(before)==len(after)==23,(len(before),len(after))
          assert set(before)==set(after)
          diff={k for k in before if before[k]!=after[k]}
          assert diff=={'feral-nova-native-recovery-v13.3.lua'},diff
          for k in set(before)-diff:assert before[k]==after[k],k
          native=after['feral-nova-native-recovery-v13.3.lua']
          assert native.strip()==(root/'feral-nova-native-recovery-v13.5.3.lua').read_text().strip()
          # No passive proximity or mixed-pack Rest interruptions.
          assert 'nearbyAttackTarget(' not in native
          assert 'COBRA PRE-BITE RANGE / REST YIELDED' not in native
          assert 'TREE COMBAT NEARBY / REST YIELDED' not in native
          assert 'GENERAL PRE-BITE CONTACT / REST YIELDED' not in native
          assert 'GetAttribute("FeralPack")' not in native
          # Prioritized mouse events only release Rest and always pass to game.
          assert 'CAS:BindActionAtPriority(bitePriorityName,function(_,state,input)' in native
          assert 'Enum.UserInputType.MouseButton1' in native
          assert 'Enum.UserInputType.MouseButton2' in native
          assert 'Enum.ContextActionResult.Pass' in native
          assert 'N.beforeBiteInput("EARLIEST BITE INPUT / AUTO REST OFF")' in native
          assert 'N.beforeBiteInput("MOUSE BITE INPUT / AUTO REST OFF",false)' in native
          assert 'GetAttributeChangedSignal("WolfBiteAt")' in native
          assert 'N.beforeBiteInput("NATIVE WOLFBITE START / REST OFF",true)' in native
          assert 'N.firstBiteDeduplicated+=1' in native
          assert 'not N.manualRest and not gameRestGuiPressed(input)' in native
          assert 'N.lastOwnedRestReleaseAt=os.clock()' in native
          assert 'now-N.lastOwnedRestReleaseAt<=2.6' in native
          assert 'CAS:UnbindAction("FERAL_HUB_FIRST_BITE_YIELD_V1353")' in native
          assert 'N.beforeKingsStrike' in native
          assert 'N.beforeFeed' in native
          # Rendering and client range enhancements untouched.
          combat=after['feral-nova-combat-v15.0.lua']
          reach=after['feral-nova-reach-v14.0.lua']
          assert 'Instance.new("TextLabel")' not in combat
          assert 'score=gap-dot*2' in combat
          assert 'record.h.OutlineColor=DIVE_COLOR' in combat
          assert 'record.h.OutlineColor=SPIT_COLOR' in combat
          assert 'CONE=math.min(original.CONE+48,124)' in reach
          assert 'MAX_DY=math.min(original.MAX_DY*1.35,4.0)' in reach
          assert 'release="13.5.3"' in new
          assert 'version="13.5.3"' in new
          assert 'activeRecord.version="feral-nova-v13.5.3"' in new
          directory=Path('/tmp/feral-1353-modules')
          directory.mkdir(exist_ok=True)
          for name,body in after.items(): (directory/name).write_text(body+'\n')
          print('FERAL_V1353_FIRST_BITE_REST_OFF_23_MODULES_PRESERVED')
          PY
      - name: Install official Luau compiler
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 --max-time 90 'https://github.com/luau-lang/luau/releases/download/0.747/luau-ubuntu.zip' -o /tmp/feral-luau.zip
          mkdir -p /tmp/feral-luau
          unzip -q /tmp/feral-luau.zip -d /tmp/feral-luau
          compiler="$(find /tmp/feral-luau -type f -name luau-compile | head -n 1)"
          test -n "$compiler"
          chmod +x "$compiler"
          echo "LUAU_COMPILER=$compiler" >> "$GITHUB_ENV"
      - name: Compile entire launcher and 23 embedded modules
        shell: bash
        run: |
          set -euo pipefail
          "$LUAU_COMPILER" --null roblox-tools/feral-nova-v13.5.3-first-bite-rest-off-potassium.lua
          "$LUAU_COMPILER" --null roblox-tools/feral-nova-native-recovery-v13.5.3.lua
          for file in /tmp/feral-1353-modules/*.lua; do "$LUAU_COMPILER" --null "$file"; done
          echo FERAL_V1353_ALL_LUAU_MODULES_COMPILE_PASS
