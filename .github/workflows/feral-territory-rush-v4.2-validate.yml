name: FERAL Territory Rush v4.2 - Session Recorder + Subsurface
on:
  push:
    branches: [main]
    paths:
      - 'roblox-tools/feral-territory-rush-v4.2.lua'
      - 'roblox-tools/feral-nova-territory-rush.lua'
      - '.github/workflows/feral-territory-rush-v4.2-validate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  luau-and-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Source invariants and truthful server-state checks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src=Path('roblox-tools/feral-territory-rush-v4.2.lua').read_text('utf-8')
          loader=Path('roblox-tools/feral-nova-territory-rush.lua').read_text('utf-8')
          required=(
              'FERAL_TERRITORY_RUSH_V4',
              'undergroundRequested','undergroundConfirmed','undergroundRefused',
              'beginUnderground','exitUnderground','failUnderground',
              'AlignPosition','FeralRushSubsurfaceHold','state.collisions',
              'state.align.Enabled=false','undergroundStatus',
              'hoverWatchConnection','EMERGENCY: losing underground hover altitude',
              'NO CLAIM PROGRESS: underground eligibility unverified',
              'evidenceProgress','evidenceScent','evidenceOwner',
              'value(a.key,"owner")==myPack',
              'SNAP: ADAPTIVE','AVOID PLAYERS: ON','RADIUS: 300',
              'SUBSURFACE: TRIAL','DEPTH: 8','territoryNeedsAvoidance',
              'otherPlayerNearby','nearestPlayerAt','safeCareSnap',
              'careSnapPending','watchCareSnap','careMode',
              'bestNPCFood','safeWaterEdge','Hunger','Thirst','FeedCan',
              'careProfiles','sendNativeBite','sendKeyE',
              'snapLockUntil','restrictSnaps','lastSnapAttemptAt',
          )
          for item in required:
              assert item in src, f'Missing core functionality: {item}'
          assert "terr:SetAttribute(" not in src, 'Cannot fake server territory ownership'
          assert "Territory:FireServer(" not in src, 'Cannot invent a direct claim remote'
          assert 'other players can still see' in src, 'Must not claim real invisibility'
          assert 'a.snapCount>=3' not in src, 'Prior repeated snap-correction loop survived'
          assert 'feral-territory-rush-v4.2.lua' in loader, 'Stable loader points at old build'
          assert 'feral-nova-v13.5.7-eagle-talon-hover-fix-experimental-potassium.lua' in loader
          # Session recorder must be complete, bounded and purely local.
          for item in (
              'SESSION FLIGHT RECORDER', 'makeSessionPayload',
              'sessionCapture','sessionHexPoll','sessionLogEvent',
              'sessionAutosave','SESSION_AUTOSAVE_INTERVAL=45.0',
              'SESSION_EVENT_CAP=360','SESSION_SAMPLE_CAP=600',
              'SESSION_HEX_CAP=700','sessionTotalHexChanges',
              'sessionReport=makeSessionPayload', 'sessionFilename=SESSION_FILENAME',
              'SAVE REPORT','COPY JSON','HttpService:JSONEncode',
              'writefile,SESSION_FILENAME,json','setclipboard,json',
              'otherPlayerNearby','serverClaimProgress',
              'undergroundVerified','hoverPositionError',
              'careInputUnavailable','sessionLastFileError',
              'No other player names, identifiers, chat',
          ):
              assert item in src, f'Session reporting missing: {item}'
          assert 'HttpService:PostAsync' not in src, 'Unexpected report upload endpoint'
          assert 'HttpService:RequestAsync' not in src, 'Unexpected report network call'
          assert 'FERAL_TERRITORY_RUSH_V42_SESSION_' in src, 'Local file name missing'

          print('FERAL_TERRITORY_V42_STATIC_PASS')
          PY
      - name: Install official Luau compiler
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 --max-time 90 'https://github.com/luau-lang/luau/releases/download/0.747/luau-ubuntu.zip' -o /tmp/feral-luau.zip
          mkdir -p /tmp/feral-rush-v42
          unzip -q /tmp/feral-luau.zip -d /tmp/feral-rush-v42
          luau="$(find /tmp/feral-rush-v42 -type f -name luau-compile | head -n 1)"
          test -n "$luau"
          chmod +x "$luau"
          echo "LUAU_COMPILER=$luau" >> "$GITHUB_ENV"
      - name: Compile new territory controller and stable launcher
        shell: bash
        run: |
          set -euo pipefail
          "$LUAU_COMPILER" --null roblox-tools/feral-territory-rush-v4.2.lua
          "$LUAU_COMPILER" --null roblox-tools/feral-nova-territory-rush.lua
          echo FERAL_TERRITORY_V42_LUAU_PASS
