name: FERAL 16.1.5 small loader compilation and source parity
on:
  push:
    branches: ['renaissance/alt-held-bite-16.1.5']
    paths:
      - 'roblox-tools/feral-renaissance-v16.1.5-loader.lua'
      - 'roblox-tools/renaissance/chunks/v16.1.5/**'
      - '.github/workflows/feral-renaissance-v16.1.5-loader.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile pinned official Luau toolchain
        run: |
          git clone --quiet https://github.com/luau-lang/luau.git /tmp/feral-luau-1615
          git -C /tmp/feral-luau-1615 checkout --quiet 97b2f4bf9cd935bed666f3e643a3b749b4d22f38
          make -s -C /tmp/feral-luau-1615 config=release -j2 luau-compile
      - name: Check loader syntax, manifest and byte-for-byte chunk parity
        run: |
          /tmp/feral-luau-1615/luau-compile --null roblox-tools/feral-renaissance-v16.1.5-loader.lua
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path("roblox-tools")
          package=root/"feral-renaissance-v16.1.5.lua"
          binary=package.read_bytes()
          manifest=json.loads((root/"renaissance/manifest.json").read_text())
          record=json.loads((root/"renaissance/candidate.json").read_text())
          assert manifest["version"]==record["version"]=="16.1.5"
          assert record["source_commit"]=="ed149b0904dc4d9aacc1b00726e680b9ea90846e"
          digest=hashlib.sha256(binary).hexdigest()
          assert digest==record["bundle_sha256"]==manifest["bundle_sha256"]
          assert len(binary)==567075
          chunks=root/"renaissance/chunks/v16.1.5"
          parts=[(chunks/f"part-{i:02d}.txt").read_bytes() for i in range(1,8)]
          assert [len(p) for p in parts]==[92996,92868,93000,92997,92948,92995,9271]
          assert b"".join(parts)==binary
          loader=(root/"feral-renaissance-v16.1.5-loader.lua").read_text()
          assert "ed149b0904dc4d9aacc1b00726e680b9ea90846e" in loader
          assert "7ec2f07a6559c54f22b37c3a438572f24342c3e0" in loader
          assert '#result == 567075' in loader
          assert '#rebuilt == 567075' in loader
          assert "LeftAlt" in package.read_text()
          assert 'reportError("Download",' in loader
          assert 'reportError("Startup", hub)' in loader
          print("VERIFIED_FERAL_16_1_5_ALT_LOADER",digest)
          PY
