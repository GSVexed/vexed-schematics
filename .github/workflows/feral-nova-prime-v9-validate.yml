name: FERAL NOVA PRIME v9 combat and escape validation
on:
  push:
    branches: [main]
    paths:
      - 'roblox-tools/feral-nova-prime-v9.0.lua'
      - 'roblox-tools/feral-nova-prime-ui-v9.0.lua'
      - 'roblox-tools/feral-nova-combat-v9.0.lua'
      - 'roblox-tools/feral-nova-escape-v9.0.lua'
      - 'roblox-tools/feral-nova-recovery-v9.0.lua'
      - '.github/workflows/feral-nova-prime-v9-validate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Obtain official Luau
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 2 --max-time 90 \
            'https://github.com/luau-lang/luau/releases/download/0.747/luau-ubuntu.zip' \
            -o /tmp/nova-v9.zip
          mkdir -p /tmp/nova-v9
          unzip -q /tmp/nova-v9.zip -d /tmp/nova-v9
          compiler="$(find /tmp/nova-v9 -type f -name luau-compile | head -n 1)"
          test -n "$compiler"
          chmod +x "$compiler"
          echo "COMPILER=$compiler" >> "$GITHUB_ENV"
          luau="$(dirname "$compiler")/luau"
          chmod +x "$luau"
          echo "LUAU=$luau" >> "$GITHUB_ENV"
      - name: Official Luau compile of every v9 dependency
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            roblox-tools/feral-aurora-engine-v2.1.lua \
            roblox-tools/feral-aurora-power-v3.1.lua \
            roblox-tools/feral-nova-escape-v9.0.lua \
            roblox-tools/feral-nova-combat-v9.0.lua \
            roblox-tools/feral-nova-recovery-v9.0.lua \
            roblox-tools/feral-nova-tags-v8.0.lua \
            roblox-tools/feral-nova-prime-ui-v9.0.lua \
            roblox-tools/feral-nova-prime-v9.0.lua; do
            "$COMPILER" --null "$f"
          done
          echo V9_OFFICIAL_COMPILE_OK
      - name: Verify safety and feature wiring
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('roblox-tools')
          loader=(p/'feral-nova-prime-v9.0.lua').read_text()
          ui=(p/'feral-nova-prime-ui-v9.0.lua').read_text()
          combat=(p/'feral-nova-combat-v9.0.lua').read_text()
          recovery=(p/'feral-nova-recovery-v9.0.lua').read_text()
          escape=(p/'feral-nova-escape-v9.0.lua').read_text()
          tags=(p/'feral-nova-tags-v8.0.lua').read_text()
          assert 'game.PlaceId~=108901361810209' in loader
          assert 'FeralNovaPrimeV90' in loader
          for module in ('feral-nova-escape-v9.0.lua',
                         'feral-nova-combat-v9.0.lua',
                         'feral-nova-recovery-v9.0.lua',
                         'feral-nova-prime-ui-v9.0.lua'):
              assert module in loader,module
          assert ui.count('    card(')==5 and ui.count('=card(')==1
          assert 'SAFE REST' in ui and 'BITE GUIDE' in ui
          assert 'HITBOX TEST' not in ui
          assert 'Name="FeralNovaPrimeV90"' in ui
          assert 'Lab.setEnabled(not Lab.enabled)' in ui
          assert 'Lab.close()' in ui and 'Recovery.close()' in ui
          assert 'Tags.close()' in ui and 'Escape.close()' in ui
          assert 'P.setStamina("RECOVER")' in ui
          assert 'P.setStamina("APEX")' not in ui
          for feature in ('FeralShakeTaps','FeralTugTap','FeralCarryEscape',
                          'FeralPinned','FeralCarried','FeralShakeHave',
                          'Escape.choose(','".112"'):
              if feature=='".112"': continue
              assert feature in escape,feature
          assert 'interval=.415' not in escape
          assert 'E.progress+=1' in escape
          assert 'nativeCount' in escape
          assert 'enabled=false,status="PASSIVE MONITOR"' in recovery
          assert 'cancelOwned("Combat/movement input; released owned Rest")' in recovery
          assert 'dangerNearby(root)' in recovery
          assert 'Recovery.shellState' in recovery
          assert 'WolfRestAt' in recovery
          assert 'RootPart.Size=' not in combat
          assert 'part.Size=' not in combat
          assert 'FireServer(' not in combat
          assert 'BodyGap' not in combat or 'bodyGap' in combat
          assert 'camera:WorldToViewportPoint' in combat
          assert 'r.b.Enabled=false' in ui
          assert 'camera:WorldToViewportPoint(world)' in tags
          for x in (combat,escape,recovery,ui):
              for disallowed in ('SetAttribute("Health"','SetAttribute("Amber"',
                                 'FireServer("Gift"','FireServer("FeralSelect"',
                                 'HttpPost(', 'github_pat_'):
                  assert disallowed not in x,disallowed
          print("V9_FEATURE_SCOPE_PASS")
          PY
      - name: Native escape decision policy in Luau
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src=Path('roblox-tools/feral-nova-escape-v9.0.lua').read_text()
          mock='game={GetService=function(self,n) if n=="Players" then return {LocalPlayer={}} end return {} end}\n'
          cases=r'''
          local f=Escape.choose
          local a,b,g=f(true,false,false,false,{})
          assert(a=="getoff" and b=="CARRIED" and g>=.4)
          a,b,g=f(false,true,true,true,{FeralTugTap=true})
          assert(a=="shake" and g>.10 and g<.15)
          a,b,g=f(false,true,true,true,{FeralShakeTaps=true})
          assert(a=="shake" and b=="DIRECTIONAL SHAKE" and g>.15)
          a,b,g=f(false,true,true,true,{FeralShakeMash=true})
          assert(a=="shake")
          a,b,g=f(false,true,false,false,{})
          assert(a==nil and b=="UNCLASSIFIED PIN")
          a,b,g=f(false,true,true,false,{})
          assert(a=="shake" and b=="PINNED CLAMP STATE" and g>.15)
          a,b,g=f(false,false,true,true,{})
          assert(a=="shake" and b=="CLAMP PROGRESS")
          a,b,g=f(false,false,false,false,{FeralTugTap=true})
          assert(a==nil)
          print("V9_NATIVE_ESCAPE_POLICY_PASS")
          '''
          Path('/tmp/v9-escape-policy.luau').write_text(mock+src.rsplit('return Escape',1)[0]+'\n'+cases)
          PY
          "$LUAU" /tmp/v9-escape-policy.luau
      - name: Simulate grab episodes, fast shake and carry events
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src=Path('roblox-tools/feral-nova-escape-v9.0.lua').read_text()
          mock=r'''
          local stamp=1
          os={clock=function()return stamp end}
          local event={Connect=function(self,fn)
              return {Disconnect=function(self) end}
          end}
          local attrs={FeralPinned=true,FeralClampN=2,FeralShakeNeed=10,FeralShakeHave=0}
          local char={
              Parent={},
              GetAttribute=function(self,k)return attrs[k]end,
              GetAttributeChangedSignal=function(self,k)return event end,
              FindFirstChildOfClass=function(self,k)
                  if k=="Humanoid" then return {Health=100} end
              end
          }
          local pg={GetDescendants=function(self)return {}end}
          local player={
              Character=char,CharacterAdded=event,
              GetAttribute=function(self,k)return nil end,
              FindFirstChildOfClass=function(self,k)return pg end
          }
          local requests={}
          local remote={
              IsA=function(self,k)return k=="RemoteEvent"end,
              FireServer=function(self,arg)table.insert(requests,arg)end
          }
          local callback
          local services={
              Players={LocalPlayer=player},
              ReplicatedStorage={
                  FindFirstChild=function(self,n)
                      if n=="FeralLunge" then return remote end
                  end
              },
              ContextActionService={
                  GetAllBoundActionInfo=function(self)
                      return {FeralShakeTaps={}}
                  end
              },
              UserInputService={GetFocusedTextBox=function(self)return nil end},
              RunService={Heartbeat={Connect=function(self,fn)
                  callback=fn
                  return {Disconnect=function(self)callback=nil end}
              end}}
          }
          game={GetService=function(self,n)return services[n] end}
          '''
          cases=r'''
          local E=Escape.attach({state={alive=true}})
          callback()
          assert(#requests==1 and requests[1]=="shake")
          stamp=1.18
          callback()
          assert(#requests==2 and requests[2]=="shake")
          attrs.FeralShakeHave=1
          stamp=1.36
          callback()
          assert(E.progress>=1)
          attrs.FeralPinned=false
          attrs.FeralClampN=0
          attrs.FeralShakeNeed=0
          stamp=1.6
          callback()
          assert(E.releaseEvents==1)
          attrs.FeralCarried=true
          stamp=1.8
          callback()
          assert(requests[#requests]=="getoff")
          assert(E.attempts.getoff==1)
          E.close()
          assert(E.alive==false and callback==nil)
          print("V9_GRAB_LIFECYCLE_PASS")
          '''
          Path('/tmp/v9-grab-life.luau').write_text(mock+src.rsplit('return Escape',1)[0]+'\n'+cases)
          PY
          "$LUAU" /tmp/v9-grab-life.luau
      - name: Simulate native bite window, resting block and marker
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src=Path('roblox-tools/feral-nova-combat-v9.0.lua').read_text().rsplit('return Combat',1)[0]
          mock=r'''
          local tm=1
          os={clock=function()return tm end}
          local V={}
          function V.__index(self,k)
              if k=="Magnitude" then
                  return math.sqrt(self.X^2+self.Y^2+self.Z^2)
              end
              if k=="Unit" then
                  local mag=math.sqrt(self.X^2+self.Y^2+self.Z^2)
                  return Vector3.new(self.X/mag,self.Y/mag,self.Z/mag)
              end
              if k=="Dot" then return function(self,v)
                  return self.X*v.X+self.Y*v.Y+self.Z*v.Z
              end end
          end
          function V.__sub(a,b)return Vector3.new(a.X-b.X,a.Y-b.Y,a.Z-b.Z)end
          function V.__add(a,b)return Vector3.new(a.X+b.X,a.Y+b.Y,a.Z+b.Z)end
          Vector3={new=function(x,y,z)
              return setmetatable({X=x,Y=y,Z=z},V)
          end}
          Vector2={new=function(x,y)return {X=x,Y=y}end}
          UDim2={fromOffset=function(x,y)return {X=x,Y=y}end}
          UDim={new=function(a,b)return {a,b}end}
          Color3={fromRGB=function()return {}end}
          Enum={UserInputType={MouseButton1=1}}
          local objects={}
          Instance={new=function(kind)
              local o={Kind=kind,Visible=false,Destroy=function(self)self.Parent=nil end}
              table.insert(objects,o)
              return o
          end}
          local listener={Connect=function(self,cb)
              return {Disconnect=function(self)end}
          end}
          local hurt=80
          local enemyRoot={
              Parent={},Position=Vector3.new(0,0,4),
              Size=Vector3.new(2,3,2)
          }
          local enemyHum={Health=hurt,HipHeight=2}
          local enemy={
              Parent={},
              GetAttribute=function(self,k)return nil end,
              FindFirstChild=function(self,k)
                  if k=="HumanoidRootPart" then return enemyRoot end
              end,
              FindFirstChildOfClass=function(self,k)
                  if k=="Humanoid" then return enemyHum end
              end
          }
          local rest=false
          local biteCallback
          local ownRoot={
              Parent={},Size=Vector3.new(2,3,2),
              Position=Vector3.new(0,0,0),
              CFrame={LookVector=Vector3.new(0,0,1)}
          }
          local hum={Health=100,HipHeight=2}
          local char={
              Parent={},
              FindFirstChild=function(self,k)
                  if k=="HumanoidRootPart" then return ownRoot end
              end,
              FindFirstChildOfClass=function(self,k)
                  if k=="Humanoid" then return hum end
              end,
              GetAttribute=function(self,k)
                  if k=="WolfRest" then return rest end
              end,
              GetAttributeChangedSignal=function(self,k)
                  return {Connect=function(self,cb)
                      biteCallback=cb
                      return {Disconnect=function(self) biteCallback=nil end}
                  end}
              end
          }
          local pg={}
          local player={
              Character=char,
              CharacterAdded=listener,
              FindFirstChildOfClass=function(self,k)return pg end,
              GetAttribute=function(self,k)return nil end
          }
          local cfg={
              REACH=1.45,CONE=71,HIT_SCALE=1.15,SLACK=.3,
              MAX_DY=1.2,
              bodyGap=function(part,v) return v.Magnitude-part.Size.Z/2 end
          }
          local mod={IsA=function(self,k)return k=="ModuleScript"end}
          require=function(m)return cfg end
          local folder={FindFirstChild=function(self,k)
              if k=="CombatConfig" then return mod end
          end}
          local input
          local beat
          game={GetService=function(self,k)
              if k=="Players" then return {
                  LocalPlayer=player,
                  GetPlayers=function(self)return {player,{Character=enemy}}end
              }end
              if k=="ReplicatedStorage" then return {
                  FindFirstChild=function(self,n)
                      if n=="FeralWorld" then return folder end
                  end
              }end
              if k=="UserInputService" then return {
                  InputBegan={Connect=function(self,fn)
                      input=fn
                      return {Disconnect=function(self)input=nil end}
                  end}
              }end
              if k=="RunService" then return {
                  Heartbeat={Connect=function(self,fn)
                      beat=fn
                      return {Disconnect=function(self)beat=nil end}
                  end}
              }end
          end}
          workspace={
              FindFirstChild=function(self,n)return nil end,
              CurrentCamera={WorldToViewportPoint=function(self,p)
                  return {X=400,Y=240,Z=2},true
              end}
          }
          '''
          cases=r'''
          local C=Combat.attach({state={alive=true}})
          beat()
          assert(C.ready==true)
          assert(C.status=="BITE WINDOW OPEN (CLIENT)")
          assert(C.targetDistance==4)
          for _,o in ipairs(objects) do
              if o.Kind=="Frame" then assert(o.Visible==true) end
          end
          assert(enemyRoot.Size.X==2 and enemyRoot.Size.Z==2)
          biteCallback()
          assert(C.bites==1)
          rest=true
          tm=1.2
          beat()
          assert(C.status=="REST ACTIVE / BITE BLOCKED")
          input({UserInputType=Enum.UserInputType.MouseButton1},false)
          assert(C.blockedRestInputs==1)
          assert(enemyRoot.Size.X==2 and enemyRoot.Size.Z==2)
          C.close()
          assert(C.alive==false and beat==nil)
          print("V9_BITE_GEOMETRY_AND_REST_BLOCK_PASS")
          '''
          Path('/tmp/v9-bite.luau').write_text(mock+src+'\n'+cases)
          PY
          "$LUAU" /tmp/v9-bite.luau
      - name: Recovery auto-off default and combat cancel regression
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src=Path('roblox-tools/feral-nova-recovery-v9.0.lua').read_text()
          mock=r'''
          local stamp=1
          os={clock=function()return stamp end}
          local inputCallback,beat
          local attrs={Species="SnappingTurtle",Hunger=80,Thirst=80}
          local hum={Health=75,MaxHealth=100}
          local root={AssemblyLinearVelocity={Magnitude=0},Position={}}
          local char={
              Parent={},
              GetAttribute=function(self,k)return attrs[k]end,
              FindFirstChildOfClass=function(self,k)
                  return k=="Humanoid" and hum or nil
              end,
              FindFirstChild=function(self,k)
                  return k=="HumanoidRootPart" and root or nil
              end
          }
          local remoteArgs={}
          local remote={
              IsA=function(self,k)return k=="RemoteEvent"end,
              FireServer=function(self,action,v)
                  assert(action=="Rest")
                  table.insert(remoteArgs,v)
              end
          }
          local player={Character=char,GetAttribute=function(self)return nil end}
          local signal={Connect=function(self,fn)
              inputCallback=fn
              return {Disconnect=function(self)inputCallback=nil end}
          end}
          local services={
              Players={LocalPlayer=player,
                  GetPlayers=function(self) return {player} end},
              ReplicatedStorage={FindFirstChild=function(self,k)
                  if k=="WolfActions" then return remote end
              end},
              UserInputService={
                  InputBegan=signal,
                  GetFocusedTextBox=function(self)return nil end
              },
              RunService={Heartbeat={Connect=function(self,fn)
                  beat=fn
                  return {Disconnect=function(self) beat=nil end}
              end}}
          }
          game={GetService=function(self,k)return services[k]end}
          workspace={GetServerTimeNow=function(self)return 100+stamp end}
          Enum={
              UserInputType={MouseButton1=1,MouseButton2=2},
              KeyCode={W=3,A=4,S=5,D=6,Space=7}
          }
          '''
          cases=r'''
          local R=Recovery.attach({state={alive=true}})
          assert(R.enabled==false)
          beat()
          stamp=10;beat()
          stamp=14;beat()
          assert(#remoteArgs==0)
          R.setEnabled(true)
          stamp=15;beat()
          stamp=18.2;beat()
          assert(#remoteArgs==1 and remoteArgs[1]==true)
          inputCallback({UserInputType=Enum.UserInputType.MouseButton1},false)
          assert(#remoteArgs==2 and remoteArgs[2]==false)
          assert(R.attackInterrupts==1)
          R.setEnabled(false)
          R.close()
          assert(R.alive==false and beat==nil)
          local state,m=Recovery.shellState("SnappingTurtle",true,100,101.1)
          assert(m==.30 and string.find(state,"SHELL CONDITION MET",1,true))
          print("V9_SAFE_REST_COMBAT_CANCEL_PASS")
          '''
          Path('/tmp/v9-safe-rest.luau').write_text(mock+src.rsplit('return Recovery',1)[0]+'\n'+cases)
          PY
          "$LUAU" /tmp/v9-safe-rest.luau
