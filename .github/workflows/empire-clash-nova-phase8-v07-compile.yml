name: Empire Clash NOVA Phase 8 v0.7 reliability validation
on:
  push:
    branches: [project-empire-clash-nova]
    paths:
      - 'roblox-tools/empire-clash-nova-phase8-simple-ui-v0.7.lua'
      - 'roblox-tools/README-empire-clash-nova-phase8-simple-ui-v0.7.md'
      - '.github/workflows/empire-clash-nova-phase8-v07-compile.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Luau compiler
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 2 --max-time 90 \
            'https://github.com/luau-lang/luau/releases/download/0.747/luau-ubuntu.zip' \
            -o /tmp/luau-nova.zip
          mkdir -p /tmp/luau-nova
          unzip -q /tmp/luau-nova.zip -d /tmp/luau-nova
          compiler="$(find /tmp/luau-nova -type f -name luau-compile | head -n1)"
          test -n "$compiler"
          chmod +x "$compiler"
          echo "LUAU_COMPILER=$compiler" >> "$GITHUB_ENV"
      - name: Compile phase 8 source (no Roblox runtime execution)
        shell: bash
        run: |
          set -euo pipefail
          "$LUAU_COMPILER" --null roblox-tools/empire-clash-nova-phase8-simple-ui-v0.7.lua
          echo EC_NOVA_PHASE8_LUAU_COMPILE_PASS
      - name: Verify source invariants and explicit risk flags
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('roblox-tools/empire-clash-nova-phase8-simple-ui-v0.7.lua').read_text()
          expected=[
            'local VERSION = "0.7.0"',
            'game.GameId ~= UNIVERSE',
            'option("Experimental shot correction"',
            'local enable = not config.ExperimentalSilentAim',
            'local function correctedRay(tool, ray)',
            'local function getFireGun()',
            'Knit.GetService("DamageService")',
            'if self ~= entry.signal or not entry.callback then',
            'Ray.new(ray.Origin, unit * magnitude)',
            'if angle > config.MaxAngularCorrection then',
            'clearPath(selection.character, selection.point)',
            'return original(self, table.unpack(args, 1, args.n))',
            'state.hookState = "OFF"',
            'silent_aim_server_verified = false',
            'anti_cheat_safety_verified = false',
            'Enum.KeyCode.RightShift',
            'applyExperimentalMode(false)',
          ]
          for token in expected:
              assert token in s,token
          assert 'DamageService.FireGun:Fire(' not in s
          assert 'ReconcilePoseWindow:Fire(' not in s
          assert 'HonestyService.PlatformAcknowledgement:Fire(' not in s
          for required in [
            'local function regionPoint(rec, visualPreview)',
            'local function estimatedPoint(part, rec, visualPreview)',
            'findTarget(reticle, false)',
            'local humanoid = character and character:FindFirstChildOfClass("Humanoid")',
            'if not native or not cam then return nil, "NO_NATIVE_RETICLE" end',
            'state.errorStreak >= 3',
            'state.skipsNoReticle += 1',
            'local desired = inRange and ((config.Outline and index <= 28)',
            'uncalibrated_prediction_preview_only = true',
          ]:
              assert required in s,required
          for hardening in [
            'local function safeBoundedInt(value, fallback, minValue, maxValue)',
            'if selectedA ~= selectedB then return selectedA end',
            'return a.rec.player.UserId < b.rec.player.UserId',
            'os.clock() - s.sampledAt > 0.35',
            'sampledAt = os.clock()',
            'state.selected, state.selection = nil, nil',
            'selected_sample_age_ms = chosen and',
          ]:
              assert hardening in s,hardening
          # Actual Roblox Player.Team, never DisguisedTeam, drives both colours.
          for faction_feature in [
            'local function factionIdentity(player)',
            'local trueTeam = player.Team',
            'player:GetAttribute("DisguisedTeam")',
            'local factionColor = identity.color',
            'rec.highlight.OutlineColor = factionColor',
            'rec.tagText.TextColor3 = factionColor',
            'identity.pretendingOurTeam',
            'rec.tagSub.Text = factionCaption(identity)',
            'option("Actual faction beneath names"',
            'option("Thief disguise warnings"',
            'cardName.TextColor3 = identity.color',
            'faction_outline_matches_nametag = true',
          ]:
              assert faction_feature in s, faction_feature
          assert 'rec.highlight.OutlineColor = selected and' not in s
          # UX: five simple options always available, advanced preserves all original controls.
          for ux in [
            'local advancedRows = {}',
            'local captureAdvanced = false',
            'local advancedOpen = false',
            'heading("QUICK CONTROLS")',
            'option("Faction-coloured outlines"',
            'option("Names + disguise warnings"',
            'option("Selected target card"',
            'option("Visual aim guide"',
            'option("Show targets through walls"',
            'local advancedToggle = press(scrolling, "ADVANCED OPTIONS',
            'captureAdvanced = true',
            'captureAdvanced = false',
            'for _, item in ipairs(advancedRows) do item.Visible = advancedOpen end',
            'for _, render in ipairs(rows) do render() end',
            'COPY DETAILS',
            'Experimental shot correction',
            'Maximum correction angle',
            'option("Queue across map travel"',
          ]:
              assert ux in s, ux
          assert 'no firing-ray or anti-cheat modifications' not in s
          assert s.count('option("Experimental shot correction"') == 1
          assert s.count('local function correctedRay(') == 1
          print('EC_NOVA_PHASE8_SCOPE_CHECK_PASS')
          PY
