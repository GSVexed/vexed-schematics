name: FERAL NOVA PRIME v14 expanded bite/recovery/water-flight regression
on:
  push:
    branches: [main]
    paths:
      - 'roblox-tools/feral-nova-prime-v14.0.lua'
      - 'roblox-tools/feral-aurora-engine-v13.0.lua'
      - 'roblox-tools/feral-nova-combat-v14.0.lua'
      - 'roblox-tools/feral-nova-prime-standalone-v14.0.lua'
      - 'roblox-tools/feral-aurora-power-v14.0.lua'
      - 'roblox-tools/feral-nova-reach-v14.0.lua'
      - 'roblox-tools/feral-nova-regen-v14.0.lua'
      - 'roblox-tools/feral-nova-flight-v14.0.lua'
      - 'roblox-tools/feral-nova-prime-ui-v14.0.lua'
      - 'roblox-tools/feral-nova-carry-v14.0.lua'
      - 'roblox-tools/feral-nova-mobile-v13.0.lua'
      - 'roblox-tools/feral-nova-recovery-v13.0.lua'
      - 'roblox-tools/feral-nova-escape-v14.0.lua'
      - '.github/workflows/feral-nova-prime-v14-validate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Download official Luau runtime and compiler
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 2 --max-time 90 \
            'https://github.com/luau-lang/luau/releases/download/0.747/luau-ubuntu.zip' \
            -o /tmp/nova-v14.zip
          mkdir -p /tmp/nova-v14
          unzip -q /tmp/nova-v14.zip -d /tmp/nova-v14
          compiler="$(find /tmp/nova-v14 -type f -name luau-compile | head -n 1)"
          test -n "$compiler"
          chmod +x "$compiler"
          echo "COMPILER=$compiler" >> "$GITHUB_ENV"
          luau="$(dirname "$compiler")/luau"
          chmod +x "$luau"
          echo "LUAU=$luau" >> "$GITHUB_ENV"
      - name: Compile every module and complete standalone release
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            roblox-tools/feral-aurora-engine-v13.0.lua \
            roblox-tools/feral-aurora-power-v14.0.lua \
            roblox-tools/feral-nova-escape-v14.0.lua \
            roblox-tools/feral-nova-combat-v14.0.lua \
            roblox-tools/feral-nova-recovery-v13.0.lua \
            roblox-tools/feral-nova-mobile-v13.0.lua \
            roblox-tools/feral-nova-carry-v14.0.lua \
            roblox-tools/feral-nova-tags-v8.0.lua \
            roblox-tools/feral-nova-reach-v14.0.lua \
            roblox-tools/feral-nova-regen-v14.0.lua \
            roblox-tools/feral-nova-flight-v14.0.lua \
            roblox-tools/feral-nova-prime-ui-v14.0.lua \
            roblox-tools/feral-nova-prime-v14.0.lua \
            roblox-tools/feral-nova-prime-standalone-v14.0.lua; do
            "$COMPILER" --null "$f"
          done
          echo V14_COMPILATION_PASS
      - name: Verify self-contained bundle and feature invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('roblox-tools')
          blob=(p/'feral-nova-prime-standalone-v14.0.lua').read_text()
          loader=(p/'feral-nova-prime-v14.0.lua').read_text()
          ui=(p/'feral-nova-prime-ui-v14.0.lua').read_text()
          carry=(p/'feral-nova-carry-v14.0.lua').read_text()
          escape=(p/'feral-nova-escape-v14.0.lua').read_text()
          mobile=(p/'feral-nova-mobile-v13.0.lua').read_text()
          combat=(p/'feral-nova-combat-v14.0.lua').read_text()
          core=(p/'feral-aurora-engine-v13.0.lua').read_text()
          reach=(p/'feral-nova-reach-v14.0.lua').read_text()
          regen=(p/'feral-nova-regen-v14.0.lua').read_text()
          flight=(p/'feral-nova-flight-v14.0.lua').read_text()
          power=(p/'feral-aurora-power-v14.0.lua').read_text()
          recovery=(p/'feral-nova-recovery-v13.0.lua').read_text()
          assert 'local ok,body=true,BUNDLED[path]' in blob
          assert 'game:HttpGet(ROOT..path)' not in blob
          assert 'game.PlaceId~=108901361810209' in blob
          sources=re.findall(
            r'\["([^"]+)"\]=\[==========\[\n(.*?)\n\]==========\]',
            blob,re.S
          )
          assert len(sources)==12,[x[0] for x in sources]
          for name,content in sources:
              assert content==(p/name).read_text(), ('bundle drift',name)
          assert 'ctx.carry=carry.attach(ctx)' in loader
          assert 'ctx.carry.close()' in loader
          assert 'ctx.reach=reach.attach(ctx)' in loader
          assert 'ctx.regen=regen.attach(ctx)' in loader
          assert 'ctx.flight=flight.attach(ctx)' in loader
          assert 'ctx.reach.close()' in loader
          assert 'ctx.regen.close()' in loader
          assert 'ctx.flight.close()' in loader
          assert 'FeralNovaPrimeV140' in loader
          assert 'FeralNovaPrimeV140' in ui
          assert ui.count('    card(')==5 and ui.count('=card(')==1
          assert 'Carry.press()' in ui
          assert 'Carry.report()' in ui
          assert 'Carry.close()' in ui
          assert 'G' in carry and 'FeralCarryPress' in carry
          assert 'FeralCarcassCarry' in carry
          assert 'FeralClamp' in carry
          assert 'FeralDragged' in carry
          assert 'classify=Carry.classify' in carry
          assert 'CARRYING / ESCAPE NOT NEEDED' in escape
          assert 'escape_cadence=carry_0.435s,tug_0.12s,shake_0.17s' in escape
          assert 'ctx.carry.classify(char)' in escape
          assert 'CARRY_PAUSED' in mobile
          assert 'carry_pause_count=' in mobile
          assert 'function M.beforeCarry()' in mobile
          assert 'function M.beforeCarry()' in recovery
          assert 'CARRYING / REST HELD OFF' in recovery
          assert 'local state,holding,victim=nil,false,false' in mobile
          assert mobile.index('if holding then') < mobile.index('if root.AssemblyLinearVelocity.Magnitude<1.6 then')
          assert recovery.index('if holding or victim then') < recovery.index('if M.multiplier==.30 then')
          assert 'CARRY ACTION / ESCAPE SUSPENDED' in escape
          assert 'carry_action_grace_frames=' in escape
          assert 'client_config_inputs=' in combat
          assert 'attempted_attacks_while_holding=' in combat
          assert 'local displayFile="FERAL_NovaPrime_Display_v14.json"' in ui
          assert 'NON-REST REGEN' in ui
          assert 'Reach.setEnabled(true)' in ui
          assert 'Regen.setEnabled(true)' in ui
          assert 'Flight.setEnabled(true)' in ui
          assert 'Mobile.report()' in ui
          assert 'P.enduranceReport()' in ui
          assert 'waterButton' in ui
          assert 'local default={tags=true,walls=true,range=450}' in ui
          assert 'P.status()' in ui
          assert 'server_stamina_and_movement_acceptance=UNVERIFIED' in ui
          assert 'char:SetAttribute("WolfRest",false)' not in core
          assert 'if on then return false end' in core
          assert 'HEALTH_NO_REGEN_IN_COMBAT' in regen
          assert 'HEALTH_REGEN' in regen
          assert 'CLOT' in regen and 'FADE' in regen and 'HEAL' in regen
          assert 'virtual_body_gap_bonus_studs=' in reach
          assert 'physical_enemy_parts_resized=0' in reach
          assert 'FeralFlyRequest' in flight
          assert 'WATER TAKEOFF' in flight
          assert 'NO_TAKEOFF' in flight
          assert 'FeralClamp' in flight
          assert 'midair_carry_guard_attempts=' in flight
          assert 'P.stamina=="RECOVER"' in power
          assert 'STAMINA_SPRINT_DRAIN=0' in power
          assert 'STAMINA_JUMP_COST=0' in power
          for code in (blob,loader,ui,carry,escape,mobile,recovery,reach,regen,flight,power):
              for bad in ('FireServer("Gift"', 'FireServer("BiteHit"',
                  'SetAttribute("Amber"', 'SetAttribute("Health"',
                  'github_pat_', 'HttpPost('):
                  assert bad not in code,bad
          for code in (carry,escape,mobile,recovery,reach,regen,flight):
              assert 'part.Size=' not in code
          assert 'FireServer(' not in carry # Uses only game's G/CarryPress
          print('V14_EXACT_12_MODULE_BUNDLE_ALL_FEATURE_INTEGRITY_PASS')
          PY
      - name: Luau test - land Endurance reasserts locally overwritten flag
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src=Path('roblox-tools/feral-aurora-power-v14.0.lua').read_text().rsplit('return Power',1)[0]
          mock=r'''
          local stamp=1
          os={clock=function()return stamp end}
          local attrs={Species="Eagle",Stamina=70,StaminaMax=100}
          local hum={Health=100,MaxHealth=100}
          local char={
              Parent={},
              GetAttribute=function(self,k)return attrs[k]end,
              SetAttribute=function(self,k,v)attrs[k]=v end,
              FindFirstChildOfClass=function(self,k)
                  if k=="Humanoid" then return hum end
              end
          }
          local player={
              Character=char,
              GetAttribute=function(self,k)return nil end
          }
          local needs={
              STAMINA_REGEN=1.31,STAMINA_REST_MULT=3,
              STAMINA_REGEN_DELAY=.8,STAMINA_LOW_NEEDS=.35,
              STAMINA_SPRINT_DRAIN=.94,STAMINA_JUMP_COST=6
          }
          local module={IsA=function(self,k)return k=="ModuleScript"end}
          local folder={FindFirstChild=function(self,k)
              if k=="NeedsConfig" then return module end
          end}
          require=function(x)return needs end
          local beat
          game={GetService=function(self,k)
              if k=="Players" then return {LocalPlayer=player}end
              if k=="ReplicatedStorage" then return {
                  FindFirstChild=function(self,k)
                      if k=="FeralWorld" then return folder end
                  end
              }end
              if k=="RunService" then return {Heartbeat={
                  Connect=function(self,fn)
                      beat=fn
                      return {Disconnect=function(self)beat=nil end}
                  end
              }}end
              if k=="UserInputService" then return {
                  GetFocusedTextBox=function(self)return nil end
              }end
          end}
          '''
          test=r'''
          local ctx={
              state={alive=true,flags={lowNeedsAssist=false}},
              notice=function(self,text)end,
              toggle=function(self,k,v)end,
              reset=function()end,
              close=function()end
          }
          local P=Power.attach(ctx)
          P.setStamina("RECOVER")
          assert(P.stamina=="RECOVER" and attrs.WolfDbgNoStamina==true)
          assert(needs.STAMINA_SPRINT_DRAIN==0 and needs.STAMINA_JUMP_COST==0)
          assert(needs.STAMINA_REGEN==1.31*3)
          attrs.WolfDbgNoStamina=false
          stamp=1.8
          beat()
          assert(attrs.WolfDbgNoStamina==true)
          assert(P.noDrainReapplyAttempts>=1)
          local report=P.enduranceReport()
          assert(string.find(report,"debug_flag_reapply_attempts=",1,true))
          ctx.close()
          assert(P.alive==false and beat==nil)
          assert(attrs.WolfDbgNoStamina==nil)
          assert(needs.STAMINA_SPRINT_DRAIN==.94 and needs.STAMINA_JUMP_COST==6)
          print("V14_LAND_BIRD_ENDURANCE_FLAG_REASSERT_RESTORE_PASS")
          '''
          Path('/tmp/v14-endurance.luau').write_text(mock+src+'\n'+test)
          PY
          "$LUAU" /tmp/v14-endurance.luau
      - name: Luau test - reversible nonphysical bite reach configuration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src=Path('roblox-tools/feral-nova-reach-v14.0.lua').read_text().rsplit('return Reach',1)[0]
          mock=r'''
          local now=5
          os={clock=function()return now end}
          local oldGap=function(part,flat) return flat.Magnitude-part.Size.Z*.5 end
          local cfg={
              REACH=1.45,HIT_SCALE=1.15,CONE=71,SLACK=1.2,MAX_DY=2.5,
              bodyGap=oldGap
          }
          local mod={IsA=function(self,k)return k=="ModuleScript"end}
          local folder={FindFirstChild=function(self,k)
              if k=="CombatConfig" then return mod end
          end}
          require=function(m)return cfg end
          local beat
          game={GetService=function(self,k)
              if k=="Players" then return {LocalPlayer={}} end
              if k=="ReplicatedStorage" then return {
                  FindFirstChild=function(self,k)
                      if k=="FeralWorld" then return folder end
                  end
              }end
              if k=="RunService" then return {Heartbeat={
                  Connect=function(self,fn)
                      beat=fn
                      return {Disconnect=function(self)beat=nil end}
                  end
              }}end
          end}
          '''
          tests=r'''
          local C=Reach.attach({state={alive=true}})
          assert(C.enabled==false and C.applied==false)
          assert(C.setEnabled(true)==true)
          assert(C.applied==true)
          assert(cfg.REACH>1.45 and cfg.HIT_SCALE>1.15)
          assert(cfg.CONE>71 and cfg.SLACK>1.2)
          assert(cfg.bodyGap~=(oldGap))
          assert(math.abs(cfg.bodyGap({Size={Z=2}},{Magnitude=5})-3.28)<.01)
          assert(C.setEnabled(false)==false)
          assert(cfg.REACH==1.45 and cfg.CONE==71 and cfg.SLACK==1.2)
          assert(cfg.HIT_SCALE==1.15 and cfg.bodyGap==oldGap)
          C.close()
          assert(C.alive==false and beat==nil)
          print("V14_NONPHYSICAL_REACH_PATCH_AND_RESTORE_PASS")
          '''
          Path('/tmp/v14-reach.luau').write_text(mock+src+'\n'+tests)
          PY
          "$LUAU" /tmp/v14-reach.luau
      - name: Luau test - non-Rest health and status config reversibility
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src=Path('roblox-tools/feral-nova-regen-v14.0.lua').read_text().rsplit('return Regen',1)[0]
          mock=r'''
          local needs={HEALTH_REGEN=.01,HEALTH_NO_REGEN_IN_COMBAT=true}
          local stat={INJURY={HEAL=.45},BLEED={CLOT=1},VENOM={FADE=1}}
          local nmod={IsA=function(self,k)return k=="ModuleScript"end}
          local smod={IsA=function(self,k)return k=="ModuleScript"end}
          require=function(m) return m==nmod and needs or stat end
          local folder={FindFirstChild=function(self,k)
              if k=="NeedsConfig" then return nmod end
              if k=="StatusConfig" then return smod end
          end}
          local beat
          game={GetService=function(self,k)
              if k=="Players" then return {LocalPlayer={}}end
              if k=="ReplicatedStorage" then return {
                  FindFirstChild=function(self,k)
                      if k=="FeralWorld" then return folder end
                  end
              }end
              if k=="RunService" then return {Heartbeat={
                  Connect=function(self,fn)
                      beat=fn
                      return {Disconnect=function(self)beat=nil end}
                  end
              }}end
          end}
          '''
          tests=r'''
          local R=Regen.attach({state={alive=true}})
          assert(not R.enabled and needs.HEALTH_NO_REGEN_IN_COMBAT)
          assert(R.setEnabled(true)==true and R.applied)
          assert(math.abs(needs.HEALTH_REGEN-.02)<.0001)
          assert(needs.HEALTH_NO_REGEN_IN_COMBAT==false)
          assert(math.abs(stat.INJURY.HEAL-1.8)<.0001)
          assert(stat.BLEED.CLOT==4 and stat.VENOM.FADE==4)
          assert(R.statusApplied==true)
          R.setEnabled(false)
          assert(math.abs(needs.HEALTH_REGEN-.01)<.0001)
          assert(needs.HEALTH_NO_REGEN_IN_COMBAT==true)
          assert(math.abs(stat.INJURY.HEAL-.45)<.0001)
          assert(stat.BLEED.CLOT==1 and stat.VENOM.FADE==1)
          R.close()
          assert(R.alive==false and beat==nil)
          print("V14_REGEN_CONFIG_PATCH_AND_RESTORE_PASS")
          '''
          Path('/tmp/v14-regen.luau').write_text(mock+src+'\n'+tests)
          PY
          "$LUAU" /tmp/v14-regen.luau
      - name: Luau test - water takeoff, prey carry, G release and cleanup
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src=Path('roblox-tools/feral-nova-flight-v14.0.lua').read_text().rsplit('return Flight',1)[0]
          mock=r'''
          local now=10
          os={clock=function()return now end}
          task={defer=function(fn)fn()end}
          local cfg={
              WATER={NO_TAKEOFF=true,GRACE=1.2},
              canFly=function(char)return true end
          }
          local m={IsA=function(self,k)return k=="ModuleScript"end}
          local folder={FindFirstChild=function(self,k)
              if k=="FlightConfig" then return m end
          end}
          require=function(x)return cfg end
          local attrs={FeralSwimLocal=true}
          local clampAttrs={Carry=true,Mode="carry"}
          local clamp={
              Parent={},
              Value={Parent={}},
              IsA=function(self,k)return k=="ObjectValue"end,
              GetAttribute=function(self,k)return clampAttrs[k]end,
              SetAttribute=function(self,k,v)clampAttrs[k]=v end
          }
          local hum={
              Health=100,FloorMaterial=0,
              GetState=function(self)return 1 end
          }
          local char={
              Parent={},
              GetAttribute=function(self,k)return attrs[k]end,
              SetAttribute=function(self,k,v)attrs[k]=v end,
              FindFirstChild=function(self,k)
                  if k=="FeralClamp" then return clamp end
              end,
              FindFirstChildOfClass=function(self,k)
                  if k=="Humanoid" then return hum end
              end,
              ChildAdded={Connect=function(self,fn)
                  return {Disconnect=function(self)end}
              end}
          }
          local added={Connect=function(self,fn)
              return {Disconnect=function(self)end}
          end}
          local player={Character=char,CharacterAdded=added}
          local jumpCb,inputCb,beat
          game={GetService=function(self,k)
              if k=="Players" then return {LocalPlayer=player}end
              if k=="ReplicatedStorage" then return {
                  FindFirstChild=function(self,k)
                      if k=="FeralWorld" then return folder end
                  end
              }end
              if k=="UserInputService" then return {
                  GetFocusedTextBox=function(self)return nil end,
                  JumpRequest={Connect=function(self,fn)
                      jumpCb=fn
                      return {Disconnect=function(self)jumpCb=nil end}
                  end},
                  InputBegan={Connect=function(self,fn)
                      inputCb=fn
                      return {Disconnect=function(self)inputCb=nil end}
                  end}
              }end
              if k=="RunService" then return {Heartbeat={
                  Connect=function(self,fn)
                      beat=fn
                      return {Disconnect=function(self)beat=nil end}
                  end
              }}end
          end}
          Enum={
              HumanoidStateType={Swimming=2},
              Material={Water=3},
              KeyCode={G=4}
          }
          '''
          tests=r'''
          local F=Flight.attach({state={alive=true}})
          assert(not F.enabled)
          assert(F.setEnabled(true)==true)
          assert(not cfg.WATER.NO_TAKEOFF and cfg.WATER.GRACE==0)
          jumpCb()
          assert(type(attrs.FeralFlyRequest)=="number")
          assert(F.attempts==1 and clampAttrs.Mode=="drag")
          assert(F.airCarrySessions==1)
          -- Native G must undo only the hub's temporary drag mode.
          inputCb({KeyCode=Enum.KeyCode.G},false)
          assert(clampAttrs.Mode=="carry")
          assert(cfg.WATER.NO_TAKEOFF==false)
          F.close()
          assert(cfg.WATER.NO_TAKEOFF==true and cfg.WATER.GRACE==1.2)
          assert(F.alive==false and beat==nil)
          assert(jumpCb==nil and inputCb==nil)
          print("V14_WATER_FLIGHT_CARRY_G_CLEANUP_PASS")
          '''
          Path('/tmp/v14-flight.luau').write_text(mock+src+'\n'+tests)
          PY
          "$LUAU" /tmp/v14-flight.luau
      - name: Luau test - predator holding prey vs captured victim and carcass
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src=Path('roblox-tools/feral-nova-carry-v14.0.lua').read_text()
          prefix='game={GetService=function(self,name) if name=="Players" then return {LocalPlayer={}} end return {} end}\n'
          cases=r'''
          local attrs={}
          local obj=nil
          local char={
              Parent={},
              GetAttribute=function(self,k)return attrs[k]end,
              FindFirstChild=function(self,k)
                  if k=="FeralClamp" then return obj end
              end
          }
          local classify=Carry.classify
          local state,holding,victim=classify(char)
          assert(state=="FREE" and not holding and not victim)
          obj={
              Parent={},
              Value={Parent={}},
              IsA=function(self,k)return k=="ObjectValue"end,
              GetAttribute=function(self,k)
                  if k=="Carry" then return true end
              end
          }
          state,holding,victim=classify(char)
          assert(state=="HOLDING PREY" and holding and not victim)
          obj=nil
          attrs.FeralCarcassCarry=true
          state,holding,victim=classify(char)
          assert(state=="HOLDING CARCASS" and holding and not victim)
          attrs.FeralCarcassCarry=false
          attrs.FeralCarried=true
          state,holding,victim=classify(char)
          assert(state=="BEING CARRIED" and victim and not holding)
          attrs.FeralCarried=false
          attrs.FeralPinned=true
          state,holding,victim=classify(char)
          assert(state=="PINNED BY ENEMY" and victim and not holding)
          attrs.FeralPinned=false
          attrs.FeralDragged=true
          state,holding,victim=classify(char)
          assert(state=="BEING DRAGGED" and victim and not holding)
          print('V14_CARRY_PREDATOR_VICTIM_SEPARATION_PASS')
          '''
          Path('/tmp/v14-carry.luau').write_text(prefix+src.rsplit('return Carry',1)[0]+'\n'+cases)
          PY
          "$LUAU" /tmp/v14-carry.luau
      - name: Luau test - G carry preserves native action and preempts Rest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src=Path('roblox-tools/feral-nova-carry-v14.0.lua').read_text().rsplit('return Carry',1)[0]
          mock=r'''
          local _G={}
          local stamp=1
          os={clock=function()return stamp end}
          local attrs={}
          local char={
              Parent={},
              GetAttribute=function(self,k)return attrs[k]end,
              FindFirstChild=function(self,k)return nil end
          }
          local pg={}
          local player={
              Character=char,
              GetAttribute=function(self,k)return nil end
          }
          local inputCb
          local beat
          local preempt=0
          local action=0
          _G.FeralCarryCan=function()return true end
          _G.FeralCarryPress=function() action+=1 end
          local services={
              Players={LocalPlayer=player},
              UserInputService={
                  GetFocusedTextBox=function(self)return nil end,
                  InputBegan={Connect=function(self,fn)
                      inputCb=fn
                      return {Disconnect=function(self)inputCb=nil end}
                  end}
              },
              RunService={Heartbeat={Connect=function(self,fn)
                  beat=fn
                  return {Disconnect=function(self)beat=nil end}
              end}}
          }
          game={GetService=function(self,k)return services[k] end}
          Enum={KeyCode={G=1}}
          '''
          cases=r'''
          local ctx={
              mobile={beforeCarry=function() preempt+=1;return false end},
              recovery={beforeCarry=function() preempt+=1;return false end}
          }
          local C=Carry.attach(ctx)
          beat()
          assert(C.canInteract==true)
