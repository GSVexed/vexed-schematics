name: Verify FERAL 16.1.6 small M1 hold loader
on:
  push:
    branches: ['renaissance/m1-tap-hold-16.1.6']
    paths:
      - 'roblox-tools/feral-renaissance-v16.1.6-loader.lua'
      - 'roblox-tools/renaissance/chunks/v16.1.6/**'
      - '.github/workflows/feral-renaissance-v16.1.6-loader.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build pinned official Luau compiler
        run: |
          git clone --quiet https://github.com/luau-lang/luau.git /tmp/feral-luau-1616
          git -C /tmp/feral-luau-1616 checkout --quiet 97b2f4bf9cd935bed666f3e643a3b749b4d22f38
          make -s -C /tmp/feral-luau-1616 config=release -j2 luau-compile
      - name: Compile loader and verify exact candidate reconstruction
        run: |
          /tmp/feral-luau-1616/luau-compile --null roblox-tools/feral-renaissance-v16.1.6-loader.lua
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path("roblox-tools")
          bundle=root/"feral-renaissance-v16.1.6.lua"
          body=bundle.read_bytes()
          record=json.loads((root/"renaissance/candidate.json").read_text())
          manifest=json.loads((root/"renaissance/manifest.json").read_text())
          assert record["version"]==manifest["version"]=="16.1.6"
          assert record["source_commit"]=="629429926b14894f78c146723b26a80f0864a31a"
          assert len(body)==569486
          digest=hashlib.sha256(body).hexdigest()
          assert digest==record["bundle_sha256"]==manifest["bundle_sha256"]
          folder=root/"renaissance/chunks/v16.1.6"
          chunks=[(folder/f"part-{i:02d}.txt").read_bytes() for i in range(1,8)]
          assert [len(chunk) for chunk in chunks]==[92961,92998,92990,93014,92941,92941,11641]
          assert b"".join(chunks)==body
          loader=(root/"feral-renaissance-v16.1.6-loader.lua").read_text()
          assert "629429926b14894f78c146723b26a80f0864a31a" in loader
          assert "fe4390cbdb0e1776fe1104720819c608d7a2c281" in loader
          assert '#result == 569486' in loader
          assert '#rebuilt == 569486' in loader
          assert 'reportError("Startup", hub)' in loader
          assert 'reportError("Download",' in loader
          assert not "LeftAlt" in loader
          print("VERIFIED_FERAL_M1_TAP_HOLD_1616_LOADER",digest)
          PY
